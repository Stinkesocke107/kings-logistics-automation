name: Kings Management Overview

on:
  # Manual diagnostic/override only. Automatic delivery is owned by the
  # centralized Leadership Overviews workflow every 12 hours.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kings-management-overview
  cancel-in-progress: false

jobs:
  management-overview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Update Kings Management Overview
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          MANAGEMENT_OVERVIEW_CHANNEL_NAME: 'management-overview'
          CONVOY_MANAGEMENT_FORUM_ID: '1550619824005062697'
        run: node management-overview.js

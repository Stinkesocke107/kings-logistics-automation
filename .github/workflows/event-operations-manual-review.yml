name: Kings Event Operations — Manual Staff Review

on:
  workflow_dispatch:
    inputs:
      review_scope:
        description: "Source review kind (no private Event content)"
        type: choice
        required: true
        options:
          - worklist
          - history
      review_code:
        description: "Choose an existing Event/History source-review reason; no private Event data"
        type: choice
        required: true
        options:
          - CONVOY_SOURCE_UNAVAILABLE
          - INVITATION_SOURCE_UNAVAILABLE
          - REVIEW_DAILY_CAP
          - REVIEW_PARTNER_MONTH_CAP
          - REVIEW_EXTERNAL_MONTH_CAP
          - REVIEW_EVENT_TYPES
          - REVIEW_FUTURE_LEGACY_HOLDS
          - REVIEW_CALENDAR_DAYS
          - REVIEW_DEPARTURE_SPACING
          - VERIFY_FORUM_TAG_MAPPING
          - REVIEW_INVITATION_DUPLICATES
          - REVIEW_EVENT_LINK_DUPLICATES
          - REVIEW_INVITATION_FORMAT
          - REVIEW_MISSING_EVENT_LINKS
          - REVIEW_PENDING_REPLIES
          - REVIEW_PAST_OUTCOMES
          - REVIEW_LEGACY_EVIDENCE
          - REVIEW_HISTORY_GAPS
          - FUTURE_LEGACY_HOLD
          - PAST_CENTER_OUTCOME
          - UNDATED_LEGACY
          - UNDATED_CENTER
          - LEGACY_ORIGINAL_EVIDENCE
          - HISTORICAL_MONTH_NO_CLAIMS
      utc_month:
        description: "YYYY-MM for History or UNDATED for undated records / worklist"
        type: string
        required: true
        default: UNDATED
      action:
        description: "Only manually recorded progress, NOT original event approval"
        type: choice
        required: true
        options:
          - start
          - block
          - record_check
          - reopen
      evidence_kind:
        description: "Record type checked privately by Staff (do not paste URLs)"
        type: choice
        required: true
        default: NONE
        options:
          - NONE
          - ORIGINAL_DISCORD
          - ORIGINAL_EVENT_PAGE
          - STAFF_RECORD
      confirmation:
        description: "For record_check only: type ORIGINAL_RECORDS_CHECKED; else leave empty"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: kings-event-leadership-reports
  cancel-in-progress: false

jobs:
  manual_review:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate review modules without private output
        run: |
          node --check event-operations-manual-review-state.js
          node --check event-operations-manual-review.js
          node --check event-leadership-state.js
      - name: Apply authorised review status to existing AES-protected Event state
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          KINGS_EVENT_REVIEW_OPERATORS: ${{ secrets.KINGS_EVENT_REVIEW_OPERATORS }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          INPUT_SCOPE: ${{ inputs.review_scope }}
          INPUT_CODE: ${{ inputs.review_code }}
          INPUT_MONTH: ${{ inputs.utc_month }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: node event-operations-manual-review.js
      - name: Save only encrypted review journal to main
        run: |
          set -euo pipefail
          if git diff --quiet -- data/event-leadership-report-state.json; then
            echo "Kings Event Operations: protected journal unchanged."
            exit 1
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-leadership-report-state.json
          git commit -m "Record authorised Kings Event Operations manual review status"
          bash scripts/git-safe-push.sh main

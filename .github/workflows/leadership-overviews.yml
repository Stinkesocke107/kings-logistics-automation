name: Kings Leadership Overviews

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - '.github/workflows/leadership-overviews.yml'
      - 'leadership-dashboard.js'
      - 'leadership-message-sync.js'

  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: write

concurrency:
  group: kings-leadership-overviews
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify one-message Leadership dashboard
        run: |
          node --check leadership-message-sync.js
          node --check leadership-dashboard.js

      - name: Refresh consolidated Leadership dashboards
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node leadership-dashboard.js

      - name: Persist consolidated dashboard IDs
        run: |
          if git diff --quiet -- data/leadership-dashboard-state.json; then
            echo "No dashboard state changes."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/leadership-dashboard-state.json
          git commit -m "Update consolidated Leadership dashboard state"
          git restore --worktree .
          rm -f data/api-health/truckersmp-vtc-members.json data/api-health/truckersmp-vtc-roles.json
          bash scripts/git-safe-push.sh main

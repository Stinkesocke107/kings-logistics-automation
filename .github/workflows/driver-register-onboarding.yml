name: Kings Driver Register Onboarding Check

on:
  workflow_dispatch:
    inputs:
      publish_private_hr_case_view:
        description: 'Manually publish private HR case pages only after approved separate HR channel configuration (never on schedule/push).'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/driver-register-onboarding.yml'
      - 'driver-tmp-vtc-register-review.js'
      - 'hr-driver-intake-review.js'
      - 'hr-driver-decision-source.js'
      - 'hr-driver-decision-audit.js'
      - 'hr-driver-case-view.js'
      - 'hr-driver-case-publisher.js'
      - 'kings-data-sources.js'
  schedule:
    # Once daily, 07:17 UTC (08:17 CET / 09:17 CEST).
    - cron: '17 7 * * *'

permissions:
  contents: read

# Share the register-audit lock to avoid competing private Leadership edits.
concurrency:
  group: kings-tmp-vtc-driver-date-review
  cancel-in-progress: false

jobs:
  driver-register-onboarding:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Kings main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate private Kings Driver registration workflow
        run: |
          node --check driver-identity-register.js
          node --check kings-data-sources.js
          node --check hr-driver-intake-review.js
          node --check hr-driver-decision-source.js
          node --check hr-driver-decision-audit.js
          node --check hr-driver-case-view.js
          node --check hr-driver-case-publisher.js
          node --check driver-loyalty-register.js
          node --check driver-welcome-register-review.js
          node --check driver-tmp-vtc-register-review.js
      - name: Refresh private pending registrations for active Kings Drivers
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_TMP_VTC_REVIEW_MODE: audit-driver-only-publish
        run: node driver-tmp-vtc-register-review.js

      - name: Read-only HR first-admission and returner decision evidence
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_HR_DECISIONS_CHANNEL_ID: ${{ secrets.KINGS_HR_DECISIONS_CHANNEL_ID }}
          KINGS_HR_CASE_VIEW_CHANNEL_ID: ${{ secrets.KINGS_HR_CASE_VIEW_CHANNEL_ID }}
          KINGS_HR_CASE_VIEW_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_private_hr_case_view == true && 'confirmed' || '' }}
        run: node hr-driver-decision-audit.js

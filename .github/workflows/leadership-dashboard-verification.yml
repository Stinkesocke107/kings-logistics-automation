name: Kings Leadership Dashboard Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'leadership-message-sync.js'
      - 'leadership-dashboard.js'
      - 'hr-driver-register-status.js'
      - 'discord-fixed-message-audit.js'
      - 'discord-leadership-content-audit.js'
      - 'discord-protected-channel-access-audit.js'
      - 'tests/discord-protected-channel-access-audit.test.cjs'
      - 'tests/discord-leadership-content-audit.test.cjs'
      - 'discord-channel-inventory-audit.js'
      - 'discord-publication-content-audit.js'
      - 'discord-webhook-destination-audit.js'
      - 'discord-event-driven-publication-audit.js'
      - 'discord-driver-public-updates-audit.js'
      - 'discord-public-convoy-content-audit.js'
      - 'discord-legacy-leadership-evidence-audit.js'
      - 'legacy-leadership-state-reconciliation.js'
      - 'tests/legacy-leadership-state-reconciliation.test.cjs'
      - 'driver-leadership-reports.js'
      - 'driver-weekly-summary.js'
      - 'hr-leadership-reports.js'
      - 'hr-weekly-summary.js'
      - 'staff-leadership-reports.js'
      - 'event-leadership-reports.js'
      - 'management-weekly-overview-v3.js'
      - 'management-monthly-report.js'
      - 'weekly-reports-verifier-v2.js'
      - '.github/workflows/leadership-dashboard-verification.yml'

permissions:
  contents: read

concurrency:
  group: kings-leadership-dashboard-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify Leadership dashboard scripts
        run: |
          node --check leadership-message-sync.js
          node --check hr-driver-register-status.js
          node --check driver-leadership-reports.js
          node --check driver-weekly-summary.js
          node --check hr-leadership-reports.js
          node --check hr-weekly-summary.js
          node --check staff-leadership-reports.js
          node --check event-leadership-reports.js
          node --check management-weekly-overview-v3.js
          node --check management-monthly-report.js
          node --check weekly-reports-verifier-v2.js
          node --check discord-fixed-message-audit.js
          node --check discord-leadership-content-audit.js
          node --check discord-protected-channel-access-audit.js
          node --check discord-channel-inventory-audit.js
          node --check discord-publication-content-audit.js
          node --check discord-webhook-destination-audit.js
          node --check discord-event-driven-publication-audit.js
          node --check discord-driver-public-updates-audit.js
          node --check discord-public-convoy-content-audit.js
          node --check discord-legacy-leadership-evidence-audit.js
          node --check legacy-leadership-state-reconciliation.js

      - name: Verify existing fixed Discord messages (read-only, no posts)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRIVER_LEADERSHIP_CHANNEL_ID: '1551675577226887229'
          HR_LEADERSHIP_CHANNEL_ID: '1383508442857340969'
          STAFF_LEADERSHIP_CHANNEL_ID: '1551675877178474526'
          EVENT_LEADERSHIP_CHANNEL_ID: '1551675735633297418'
          MANAGEMENT_OVERVIEW_CHANNEL_ID: '1492936683304517792'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node discord-fixed-message-audit.js

      - name: Verify all five current consolidated Leadership content contracts (read-only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --test tests/discord-leadership-content-audit.test.cjs
          node discord-leadership-content-audit.js

      - name: Verify mapped Kings Discord channels (read-only, no posts or member reads)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node discord-channel-inventory-audit.js

      - name: Verify Kings live/public publications directly in Discord (read-only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
          NEWS_DISCORD_WEBHOOK_URL: ${{ secrets.NEWS_DISCORD_WEBHOOK_URL }}
        run: node discord-publication-content-audit.js

      - name: Verify all Kings configured Discord webhook destinations (read-only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
          NEWS_DISCORD_WEBHOOK_URL: ${{ secrets.NEWS_DISCORD_WEBHOOK_URL }}
          CHANGELOG_DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_URL }}
          MILESTONE_DISCORD_WEBHOOK_URL: ${{ secrets.MILESTONE_DISCORD_WEBHOOK_URL }}
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
          MONTHLY_REPORT_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_REPORT_DISCORD_WEBHOOK_URL }}
        run: node discord-webhook-destination-audit.js

      - name: Verify Kings event-driven public publications without posting anything
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          CHANGELOG_DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_URL }}
          MONTHLY_REPORT_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_REPORT_DISCORD_WEBHOOK_URL }}
        run: node discord-event-driven-publication-audit.js

      - name: Verify latest Kings Driver Update post and mention boundaries (read-only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
        run: node discord-driver-public-updates-audit.js

      - name: Verify existing Public Convoy posts read-only
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_KINGS_CONVOY_ANNOUNCEMENT_CHANNEL_ID: '1351613882791366838'
        run: node discord-public-convoy-content-audit.js

      - name: Reconcile Legacy Leadership state metadata without claiming delivery
        run: |
          node --test tests/legacy-leadership-state-reconciliation.test.cjs
          node legacy-leadership-state-reconciliation.js

      - name: Verify archived Legacy Leadership message identities read-only
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node discord-legacy-leadership-evidence-audit.js

      - name: Audit protected Kings Driver register and optional HR channel access (read-only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          KINGS_HR_DECISIONS_CHANNEL_ID: ${{ secrets.KINGS_HR_DECISIONS_CHANNEL_ID }}
          KINGS_HR_CASE_VIEW_CHANNEL_ID: ${{ secrets.KINGS_HR_CASE_VIEW_CHANNEL_ID }}
        run: |
          node --test tests/discord-protected-channel-access-audit.test.cjs
          node discord-protected-channel-access-audit.js

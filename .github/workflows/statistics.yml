name: Kings Statistics Manual

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kings-statistics-manual
  cancel-in-progress: false

jobs:
  update-statistics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update Kings Advanced Statistics
        env:
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
        run: node statistics.js

      - name: Update Kings Central Overview
        env:
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node central-overview.js

      - name: Save Statistics Data
        run: |
          if git diff --quiet -- data/statistics.json data/central-overview.json && [ -z "$(git status --porcelain data/statistics.json data/central-overview.json)" ]; then
            echo "No Statistics data changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/statistics.json
          git add data/central-overview.json

          git commit -m "Update Kings Statistics"

          git pull --rebase origin main
          git push origin main

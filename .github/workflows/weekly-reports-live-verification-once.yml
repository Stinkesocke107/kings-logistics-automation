name: Kings Weekly Reports Live Verification Once

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-weekly-reports-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify current Weekly scripts
        run: |
          node --check driver-weekly-summary.js
          node --check hr-weekly-summary.js
          node --check hr-weekly-summary-runner.js
          node --check management-weekly-overview-v3.js
          node --check weekly-reports-verifier-v2.js

      - name: Verify Weekly Reports against live Discord history
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_LEADERSHIP_CHANNEL_NAME: '🚛｜driver-leadership'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
          MANAGEMENT_OVERVIEW_CHANNEL_NAME: 'management-overview'
        run: node weekly-reports-verifier-v2.js

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-weekly-reports-final-live-proof-${{ github.run_number }}
          path: output/weekly-reports-verification.json
          if-no-files-found: warn
          retention-days: 30

name: Kings Leadership Channel Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/leadership-channel-diagnostic.yml'

permissions:
  contents: read

jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List Leadership channel IDs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: |
          node - <<'NODE'
          const token = process.env.DISCORD_BOT_TOKEN;
          const guild = process.env.DISCORD_GUILD_ID;
          const response = await fetch(`https://discord.com/api/v10/guilds/${guild}/channels`, {
            headers: { Authorization: `Bot ${token}`, 'User-Agent': 'Kings Leadership Diagnostic/1.0' }
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`Discord ${response.status}: ${text.slice(0,300)}`);
          const channels = JSON.parse(text);
          for (const channel of channels) {
            if (/leadership|management-overview/i.test(String(channel.name || ''))) {
              console.log(`${channel.id} :: ${channel.name}`);
            }
          }
          NODE

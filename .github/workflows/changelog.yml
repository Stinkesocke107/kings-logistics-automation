name: Kings Changelog Publisher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kings-changelog-publisher
  cancel-in-progress: false

jobs:
  publish-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish Kings Changelog
        env:
          CHANGELOG_DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_URL }}
        run: node changelog.js

      - name: Save Changelog Data
        run: |
          if git diff --quiet -- data/changelog-state.json data/changelog-history.json data/changelog-queue.json && [ -z "$(git status --porcelain data/changelog-state.json data/changelog-history.json data/changelog-queue.json)" ]; then
            echo "No Changelog data changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/changelog-state.json
          git add data/changelog-history.json
          git add data/changelog-queue.json

          git commit -m "Publish Kings Changelog"

          git pull --rebase origin main
          git push origin main

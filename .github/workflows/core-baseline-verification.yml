name: Kings Stable Core Baseline Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: kings-core-baseline-verification
  cancel-in-progress: false

jobs:
  stable-core-baseline:
    if: github.ref == 'refs/heads/main'
    name: Verify Point 20 Stable Core Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KINGS_CORE_BASELINE_ID: 'KINGS-CORE-BASELINE-2026-10-01'

    steps:
      - name: Checkout exact baseline candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Require clean initial repository state
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain)"
          if [ -n "$STATUS" ]; then
            echo 'ERROR: baseline checkout is not clean.'
            echo "$STATUS"
            exit 1
          fi
          echo "Baseline candidate commit: $(git rev-parse HEAD)"
          echo "Baseline candidate tree: $(git rev-parse 'HEAD^{tree}')"

      - name: Recover stale safe technical producers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KINGS_RECOVERY_WAIT_MS: '90000'
          KINGS_RECOVERY_POLL_MS: '5000'
        run: node workflow-recovery.js

      - name: Refresh recovered runtime state without accepting Core drift
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$GITHUB_SHA"
          git fetch origin main
          REMOTE_HEAD="$(git rev-parse origin/main)"

          if [ "$REMOTE_HEAD" != "$BASE_SHA" ]; then
            CORE_CHANGES="$(git diff --name-only "$BASE_SHA" "origin/main" -- \
              ':(top,glob)*.js' \
              '.github/workflows/**' \
              'scripts/**' \
              'tests/**' \
              '.gitignore' \
              'package.json' \
              'package-lock.json')"

            if [ -n "$CORE_CHANGES" ]; then
              echo 'ERROR: protected Core files changed while the baseline gate was recovering runtime state.'
              echo "$CORE_CHANGES"
              echo 'Start a fresh Point 20 run from the newer Core commit.'
              exit 1
            fi

            echo "Only mutable/non-Core files changed on main; fast-forwarding from $BASE_SHA to $REMOTE_HEAD."
            git merge --ff-only origin/main
          fi

          TRACKED_STATUS="$(git status --porcelain --untracked-files=no)"
          if [ -n "$TRACKED_STATUS" ]; then
            echo 'ERROR: tracked repository state is dirty after runtime refresh.'
            echo "$TRACKED_STATUS"
            exit 1
          fi

          echo "Point 20 verification HEAD after safe runtime refresh: $(git rev-parse HEAD)"

      - name: Verify Core syntax and safety helpers
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js tests/*.cjs; do node --check "$file"; done
          bash -n scripts/git-safe-push.sh
          node branding-self-test.js

      - name: Run complete isolated regression and integration suite
        run: node --test tests/*.test.cjs

      - name: Build fresh read-only production health snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KINGS_API_HEALTH_NAMESPACE: 'core-baseline'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        shell: bash
        run: |
          set -euo pipefail
          node system-monitoring.js
          node data-integrity.js
          node system-hardening.js
          node security-audit.js
          node discord-permission-audit.js

          node - <<'NODE'
          const h = require('./data/system-health.json');
          if (h.status !== 'HEALTHY') throw new Error(`Point 20 System Health is ${h.status}`);
          if (Number(h.summary?.criticalIssues || 0) !== 0) throw new Error(`Point 20 has ${h.summary?.criticalIssues} Critical Issue(s).`);
          if (Number(h.summary?.warnings || 0) !== 0) throw new Error(`Point 20 has ${h.summary?.warnings} Warning(s).`);
          console.log(`Point 20 System Health: HEALTHY; Critical=0; Warnings=0; APIs=${h.summary?.apiServicesHealthy}/${h.summary?.apiServicesChecked}`);
          NODE

      - name: Verify API resilience and production API health
        run: node api-resilience-verifier.js

      - name: Verify Git and persistent-state hardening
        run: node git-state-hardening-verifier.js

      - name: Verify Weekly Reports read-only
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_LEADERSHIP_CHANNEL_NAME: '🚛｜driver-leadership'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
          MANAGEMENT_OVERVIEW_CHANNEL_NAME: 'management-overview'
        run: node weekly-reports-verifier-v2.js

      - name: Verify Monthly Report read-only
        env:
          MONTHLY_REPORT_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_REPORT_DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node monthly-report-verifier.js

      - name: Verify Public Convoy Announcement state read-only
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_KINGS_CONVOY_SOURCE_FORUM_ID: '1506133821693755502'
          DISCORD_KINGS_CONVOY_ANNOUNCEMENT_CHANNEL_ID: '1351613882791366838'
          KINGS_API_HEALTH_NAMESPACE: 'core-baseline-convoy-verifier'
        run: node kings-convoy-announcement-verifier.js

      - name: Verify complete Backup and Restore roundtrip
        shell: bash
        run: |
          set -euo pipefail
          node core-backup.js
          node backup-final-check.js

          node - <<'NODE'
          const fs = require('fs');
          const core = JSON.parse(fs.readFileSync('backup-staging/backup-health.json', 'utf8'));
          const final = JSON.parse(fs.readFileSync('backup-staging/backup-final-health.json', 'utf8'));
          const restore = JSON.parse(fs.readFileSync('backup-staging/backup-restore-verification.json', 'utf8'));
          if (core.healthy !== true || final.healthy !== true || restore.healthy !== true) {
            throw new Error('Point 20 Backup/Restore is not HEALTHY.');
          }
          if (restore.summary.manifestFiles !== restore.summary.restoredFiles) throw new Error('Point 20 restore file count mismatch.');
          if (restore.summary.manifestFiles !== restore.summary.checksumsVerified) throw new Error('Point 20 restore checksum coverage mismatch.');
          if (fs.existsSync('restore-verification')) throw new Error('Point 20 disposable restore sandbox was not removed.');
          console.log(`Point 20 Backup/Restore: HEALTHY; restored=${restore.summary.restoredFiles}/${restore.summary.manifestFiles}; sha256=${restore.summary.checksumsVerified}/${restore.summary.manifestFiles}`);
          NODE

      - name: Aggregate full Core End-to-End state
        run: node core-e2e-verifier.js

      - name: Create Stable Core Baseline fingerprint
        run: node core-baseline-verifier.js

      - name: Upload Point 20 baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-stable-core-baseline-${{ github.run_number }}
          path: |
            output/workflow-recovery.json
            output/core-baseline-verification.json
            output/core-e2e-verification.json
            output/api-resilience-verification.json
            output/api-resilience-final-report.json
            output/git-state-hardening-verification.json
            output/git-state-hardening-final-report.json
            output/weekly-reports-verification.json
            output/monthly-report-verification.json
            output/kings-convoy-announcement-verification.json
            data/system-health.json
            data/data-integrity.json
            data/system-hardening.json
            data/security-audit.json
            data/discord-permission-audit.json
            backup-staging/backup-manifest.json
            backup-staging/backup-health.json
            backup-staging/backup-final-health.json
            backup-staging/backup-restore-verification.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9

      - name: Point 20 Core Freeze summary
        if: always()
        shell: bash
        run: |
          echo '## Kings Stable Core Baseline — Point 20' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Baseline ID: **KINGS-CORE-BASELINE-2026-10-01**' >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger commit: **$GITHUB_SHA**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified repository HEAD: **$(git rev-parse HEAD)**" >> "$GITHUB_STEP_SUMMARY"
          echo '- Freeze scope: **Core code, workflows, tests, scripts and security configuration**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mutable runtime state (`data/**`): **excluded from the fingerprint by design**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Safe producer recovery: **Driver Updates + Live Tracker only**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production Discord writes by this verifier: **none**' >> "$GITHUB_STEP_SUMMARY"
          echo '- API failure injection: **local mock only**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Git conflict injection: **temporary local repositories only**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Backup restore: **disposable isolated sandbox only**' >> "$GITHUB_STEP_SUMMARY"

          if [ -f output/core-baseline-verification.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r = require('./output/core-baseline-verification.json');
          console.log(`- Final baseline status: **${r.baseline?.status || 'UNKNOWN'}**`);
          console.log(`- Protected Core files: **${r.baseline?.protectedCoreFiles || 0}**`);
          console.log(`- Core fingerprint: \`${r.baseline?.protectedCoreFingerprintSha256 || 'missing'}\``);
          console.log(`- Health: **${r.gates?.systemHealthHealthy ? 'HEALTHY' : 'NOT HEALTHY'}**`);
          console.log(`- Critical Issues: **${r.gates?.criticalIssues ?? 'unknown'}**`);
          console.log(`- Warnings: **${r.gates?.warnings ?? 'unknown'}**`);
          console.log(`- API Resilience: **${r.gates?.apiHealthy ? 'HEALTHY' : 'NOT HEALTHY'}**`);
          console.log(`- Backup/Restore: **${r.gates?.backupHealthy && r.gates?.restoreHealthy ? 'HEALTHY' : 'NOT HEALTHY'}**`);
          console.log(`- Git/State: **${r.gates?.gitStateHealthy && r.gates?.trackedGitClean ? 'CLEAN' : 'NOT CLEAN'}**`);
          NODE
          fi

name: Kings TruckersMP News

on:
  workflow_dispatch:

  schedule:
    # Every 5 minutes, staggered to reduce scheduling congestion
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-truckersmp-news
  cancel-in-progress: false

jobs:
  check-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'news'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check TruckersMP News
        env:
          NEWS_DISCORD_WEBHOOK_URL: ${{ secrets.NEWS_DISCORD_WEBHOOK_URL }}
        run: node news.js

      - name: Save News Dedupe, Publication Evidence and API Health Together
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/last-news.json data/news-publication-state.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings News and API state"
          bash scripts/git-safe-push.sh main

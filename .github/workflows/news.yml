name: Kings TruckersMP News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-truckersmp-news
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Kings TruckersMP News
        env:
          NEWS_DISCORD_WEBHOOK_URL: ${{ secrets.NEWS_DISCORD_WEBHOOK_URL }}
        run: node news.js

      - name: Save News State
        run: |
          if git diff --quiet -- data/last-news.json && [ -z "$(git status --porcelain data/last-news.json)" ]; then
            echo "No news state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/last-news.json
          git commit -m "Update Kings News state"
          git push

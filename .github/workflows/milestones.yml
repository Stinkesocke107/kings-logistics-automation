name: Kings Milestone Detector

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'milestones.js'
      - 'api-resilience.js'
      - 'scripts/git-safe-push.sh'
      - '.github/workflows/milestones.yml'

  schedule:
    # Shifted by one minute to force GitHub to register a genuinely new schedule trigger.
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-milestone-detector
  cancel-in-progress: false

jobs:
  check-milestones:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'milestones'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check Kings Milestones
        env:
          MILESTONE_DISCORD_WEBHOOK_URL: ${{ secrets.MILESTONE_DISCORD_WEBHOOK_URL }}
          NEWS_NOTIFICATIONS_ROLE_ID: ${{ secrets.NEWS_NOTIFICATIONS_ROLE_ID }}
        run: node milestones.js

      - name: Save Milestone, Changelog and API Health State
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/milestones.json data/changelog-queue.json data/api-health)" ]; then
            echo "No Milestone, Changelog Queue, or API health changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/milestones.json data/changelog-queue.json data/api-health

          if git diff --cached --quiet; then
            echo "No Milestone state changes staged."
            exit 0
          fi

          git commit -m "Update Kings Milestone state"
          bash scripts/git-safe-push.sh main

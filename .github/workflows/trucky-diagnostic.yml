name: Kings Trucky API Read-only Diagnostic
on:
  pull_request:
    paths:
      - 'scripts/trucky-api-diagnostic.cjs'
      - '.github/workflows/trucky-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Probe documented Trucky map status APIs without user data in logs
        run: node scripts/trucky-api-diagnostic.cjs

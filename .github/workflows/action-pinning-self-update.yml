name: Temporary Immutable Action Pinning

on:
  push:
    paths:
      - '.github/workflows/action-pinning-self-update.yml'

permissions:
  contents: write

concurrency:
  group: kings-action-pinning-self-update
  cancel-in-progress: false

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Pin external Actions
        run: node pin-actions.js

      - name: Commit pinned workflow references
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "All workflow Actions were already pinned."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Pin GitHub Actions to immutable commit SHAs"
          git pull --rebase origin main
          git push origin main

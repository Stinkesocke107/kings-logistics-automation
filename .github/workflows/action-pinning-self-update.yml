name: Temporary Immutable Action Pinning

on:
  push:
    paths:
      - '.github/workflows/action-pinning-self-update.yml'

permissions:
  contents: read

concurrency:
  group: kings-action-pinning-self-update
  cancel-in-progress: false

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Pin external Actions in isolated runner
        run: node pin-actions.js

      - name: Upload pinned workflows for direct GitHub update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinned-kings-workflows
          path: .github/workflows/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

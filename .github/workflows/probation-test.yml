name: Kings Probation Test

on:
  workflow_dispatch:

jobs:
  test-probation-message:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Send Safe Probation Test
        env:
          HR_AUTOMATION_WEBHOOK_URL: ${{ secrets.HR_AUTOMATION_WEBHOOK_URL }}
        run: |
          node <<'EOF'
          async function main() {
            const webhook = process.env.HR_AUTOMATION_WEBHOOK_URL;

            if (!webhook) {
              throw new Error("HR_AUTOMATION_WEBHOOK_URL is missing.");
            }

            const joinedAt = Math.floor(
              (Date.now() - (7 * 24 * 60 * 60 * 1000)) / 1000
            );

            const payload = {
              embeds: [
                {
                  title: "👑 Kings Driver Probation Review",
                  description:
                    "**[ExampleDriver](https://truckersmp.com/user/1234567)** " +
                    "has reached the end of the **7-day Driver probation period**.",

                  color: 1584639,

                  fields: [
                    {
                      name: "TruckersMP ID",
                      value: "1234567",
                      inline: true
                    },
                    {
                      name: "Status",
                      value: "Active Kings Driver",
                      inline: true
                    },
                    {
                      name: "Joined Kings",
                      value: `<t:${joinedAt}:F>\n<t:${joinedAt}:R>`,
                      inline: false
                    },
                    {
                      name: "HR Action",
                      value:
                        "Please review the Driver's probation period and complete the appropriate internal decision.",
                      inline: false
                    }
                  ],

                  footer: {
                    text: "Kings Logistics • HR Automation • TEST"
                  },

                  timestamp: new Date().toISOString()
                }
              ],

              allowed_mentions: {
                parse: []
              }
            };

            const response = await fetch(webhook, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(
                `Discord webhook failed: HTTP ${response.status} - ${await response.text()}`
              );
            }

            console.log("Safe HR Probation test message sent successfully.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

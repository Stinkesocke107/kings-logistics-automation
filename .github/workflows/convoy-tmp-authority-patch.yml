name: Temporary Convoy TruckersMP Authority Patch

on:
  push:
    paths:
      - '.github/workflows/convoy-tmp-authority-patch.yml'

permissions:
  contents: write

jobs:
  patch-convoy-display:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Patch authoritative TruckersMP display logic
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path('convoy-time-display.js')
          content = file.read_text(encoding='utf-8')

          old_validation = '''  const eventIdField = latestHumanEventId(messages);
          if (eventIdField) {
            item.eventId = eventIdField.value;
            sources.eventId = eventIdField;
          }

          const eventDate = parsed.eventDate || null;'''

          new_validation = '''  const eventIdField = latestHumanEventId(messages);
          if (eventIdField) {
            item.eventId = eventIdField.value;
            sources.eventId = eventIdField;
          }

          // TruckersMP is authoritative for public event data whenever its API sync succeeded.
          // Kings-specific fields such as Responsible Staff, Kings Slot and image proof stay Discord-owned.
          const tmpAuthoritative = item.truckersmpSync?.ok && item.truckersmpSync?.authoritative
            ? item.truckersmp?.authoritative
            : null;

          if (tmpAuthoritative) {
            const authoritativeKeys = ['eventType', 'route', 'start', 'destination', 'meetup', 'meetupTime'];
            for (const key of authoritativeKeys) {
              const value = tmpAuthoritative[key];
              if (value !== null && value !== undefined && String(value).trim() !== '') {
                parsed[key] = value;
              }
            }

            if (tmpAuthoritative.eventDate) {
              parsed.eventDate = tmpAuthoritative.eventDate;
              parsed.eventDateRaw = tmpAuthoritative.eventDate;
            }

            sources.truckersmp = {
              eventId: item.eventId || item.truckersmp?.id || null,
              syncedAt: item.truckersmpSync?.syncedAt || null,
              authoritative: true
            };
          }

          const eventDate = parsed.eventDate || null;'''

          if old_validation not in content:
              raise SystemExit('Could not find convoy validation insertion point.')
          content = content.replace(old_validation, new_validation, 1)

          display_start = content.find("  const eventLine = item.eventId ?")
          display_end = content.find("\n}\n\nasync function syncStatusMessage", display_start)
          if display_start < 0 or display_end < 0:
              raise SystemExit('Could not find convoy status display block.')

          new_display = '''  const tmpAuthoritative = Boolean(item.truckersmpSync?.ok && item.truckersmpSync?.authoritative);
          const eventLine = item.eventId ? `🔗 **TruckersMP Event ID:** ${item.eventId}` : null;
          const sourceLine = tmpAuthoritative
            ? `🌐 **Event Source:** TruckersMP Event #${item.eventId || item.truckersmp?.id} · authoritative`
            : null;
          const typeLine = tmpAuthoritative && item.validation?.parsed?.eventType
            ? `📋 **Event Type:** ${item.validation.parsed.eventType}`
            : null;
          const dateLine = tmpAuthoritative && item.validation?.parsed?.eventDate
            ? `📅 **Event Date:** ${item.validation.parsed.eventDate}`
            : null;
          const routeLine = tmpAuthoritative && item.validation?.parsed?.route
            ? `🛣️ **Route:** ${item.validation.parsed.route}`
            : null;
          const meetingPointLine = tmpAuthoritative && item.validation?.parsed?.meetup
            ? `📍 **Meeting Point:** ${item.validation.parsed.meetup}`
            : null;
          const gameServerLine = tmpAuthoritative && (item.truckersmp?.game || item.truckersmp?.server)
            ? `🎮 **Game / Server:** ${[item.truckersmp?.game, item.truckersmp?.server].filter(Boolean).join(' · ')}`
            : null;
          const eventTimeLine = item.eventUnix
            ? `🕒 **Meeting Time:** ${discordTimestamp(item.eventUnix, 'F')} · ${discordTimestamp(item.eventUnix, 'R')}`
            : null;

          return [
            STATUS_MESSAGE_MARKER,
            '',
            `**Status:** \`${item.status}\``,
            validationLine,
            approvalLine,
            eventLine,
            sourceLine,
            typeLine,
            dateLine,
            routeLine,
            meetingPointLine,
            gameServerLine,
            eventTimeLine,
            '',
            '🤖 This is the single automated status message for this convoy. It is checked every 15 minutes and updated only when something changes.'
          ].filter(Boolean).join('\\n');'''

          content = content[:display_start] + new_display + content[display_end:]
          file.write_text(content, encoding='utf-8')
          PY

          node --check convoy-time-display.js

      - name: Save convoy display patch
        run: |
          if git diff --quiet -- convoy-time-display.js; then
            echo 'No patch needed.'
            exit 0
          fi

          git config user.name 'Kings Logistics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add convoy-time-display.js
          git commit -m 'Keep TruckersMP event data authoritative in convoy display'
          git pull --rebase origin main
          git push origin main

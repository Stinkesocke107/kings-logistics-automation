name: Test Kings Milestone

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Send Test Milestone
        env:
          MILESTONE_DISCORD_WEBHOOK_URL: ${{ secrets.MILESTONE_DISCORD_WEBHOOK_URL }}
          NEWS_NOTIFICATIONS_ROLE_ID: ${{ secrets.NEWS_NOTIFICATIONS_ROLE_ID }}
        run: |
          node <<'NODE'
          const webhook =
            process.env.MILESTONE_DISCORD_WEBHOOK_URL;

          const newsRoleId =
            process.env.NEWS_NOTIFICATIONS_ROLE_ID;

          if (!webhook) {
            throw new Error(
              "MILESTONE_DISCORD_WEBHOOK_URL is missing."
            );
          }

          if (!newsRoleId) {
            throw new Error(
              "NEWS_NOTIFICATIONS_ROLE_ID is missing."
            );
          }

          const content =
            `🧪 **TEST — Kings Milestone Announcement**\n\n` +

            `<@&${newsRoleId}>\n\n` +

            `👑🎉 **150 KINGS LOGISTICS MEMBERS**\n\n` +

            `We have officially reached another major milestone — ` +
            `**150 members on TruckersMP!**\n\n` +

            `Thank you to every member of the **Kings Logistics Family** ` +
            `for being part of our journey and helping Kings continue to grow. 🌍🚛\n\n` +

            `This is another important step forward — ` +
            `and there is still much more ahead of us.\n\n` +

            `Thank you for being part of Kings. 👑\n\n` +

            `**Kings Logistics — Connecting the world, creating friendships.** ` +
            `<:kings_heart:1500949819110326352>`;

          const response =
            await fetch(
              webhook,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    content,

                    // TEST ONLY:
                    // Role is displayed but nobody is actually pinged.
                    allowed_mentions: {
                      parse: []
                    }
                  })
              }
            );

          if (!response.ok) {
            const errorText =
              await response.text();

            throw new Error(
              `Discord Milestone test failed: HTTP ${response.status} - ${errorText}`
            );
          }

          console.log(
            "Test Kings Milestone sent successfully."
          );
          NODE

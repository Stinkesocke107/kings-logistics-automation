name: One-time API Health Monitor Integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-api-health-monitor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Integrate API health monitoring
        run: python3 tools/integrate-api-health-monitor.py

      - name: Validate monitoring integration
        run: |
          node --check system-monitoring.js
          grep -q "function checkApiHealth" system-monitoring.js
          grep -q "apiServicesDown" system-monitoring.js
          grep -q "apiHealth," system-monitoring.js

      - name: Remove temporary patch script
        run: rm -f tools/integrate-api-health-monitor.py

      - name: Save monitoring integration
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add system-monitoring.js
          git add -A -- tools/integrate-api-health-monitor.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integrate API health into Kings monitoring"
          git pull --rebase origin main
          git push origin main

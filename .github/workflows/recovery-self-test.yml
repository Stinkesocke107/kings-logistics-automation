name: Kings Recovery Self Test

on:
  push:
    paths:
      - '.github/workflows/recovery-self-test.yml'
      - 'recovery-safety-check.js'
      - 'core-recovery.js'

permissions:
  contents: read

jobs:
  recovery-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax Check Recovery Engines
        run: |
          node --check core-recovery.js
          node --check recovery-safety-check.js

      - name: Build Isolated Restore Fixture
        shell: bash
        run: |
          TEST_ROOT="$RUNNER_TEMP/kings-recovery-self-test"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT/restore-source"

          cp core-recovery.js "$TEST_ROOT/core-recovery.js"
          cp recovery-safety-check.js "$TEST_ROOT/recovery-safety-check.js"

          printf 'CURRENT VERSION\n' > "$TEST_ROOT/README.md"
          printf 'BACKUP VERSION\n' > "$TEST_ROOT/restore-source/README.md"

          TEST_ROOT="$TEST_ROOT" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const root = process.env.TEST_ROOT;
          const source = path.join(root, 'restore-source');
          const backupFile = path.join(source, 'README.md');
          const bytes = fs.readFileSync(backupFile);
          const hash = crypto.createHash('sha256').update(bytes).digest('hex');
          const runNumber = '999999';
          const repository = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME || 'main';
          const commit = '1111111111111111111111111111111111111111';
          const runId = '999999999';

          const manifest = {
            version: 2,
            createdAt: new Date().toISOString(),
            repository,
            branch,
            commit,
            workflowRunId: runId,
            workflowRunNumber: runNumber,
            files: [{ path: 'README.md', size: bytes.length, sha256: hash }]
          };

          const health = { version: 1, status: 'HEALTHY', healthy: true };
          const finalHealth = { version: 1, status: 'HEALTHY', healthy: true };
          const restorePoint = {
            version: 1,
            type: 'restore-point',
            name: 'isolated-self-test',
            createdAt: new Date().toISOString(),
            repository,
            branch,
            commit,
            workflowRunId: runId,
            workflowRunNumber: runNumber
          };

          fs.writeFileSync(path.join(source, 'backup-manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync(path.join(source, 'backup-health.json'), JSON.stringify(health, null, 2) + '\n');
          fs.writeFileSync(path.join(source, 'backup-final-health.json'), JSON.stringify(finalHealth, null, 2) + '\n');
          fs.writeFileSync(path.join(source, 'restore-point.json'), JSON.stringify(restorePoint, null, 2) + '\n');
          NODE

          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Safety Gate Accepts Healthy Restore Point
        shell: bash
        run: |
          cd "$TEST_ROOT"
          RECOVERY_TARGET_RUN=999999 RECOVERY_MODE=apply node recovery-safety-check.js

      - name: Safety Gate Blocks Forbidden Secret File
        shell: bash
        run: |
          cd "$TEST_ROOT"
          printf 'DO_NOT_RESTORE=secret\n' > restore-source/.env

          if RECOVERY_TARGET_RUN=999999 RECOVERY_MODE=apply node recovery-safety-check.js; then
            echo "ERROR: Safety gate accepted a forbidden .env file."
            exit 1
          fi

          rm -f restore-source/.env
          RECOVERY_TARGET_RUN=999999 RECOVERY_MODE=apply node recovery-safety-check.js
          echo "Forbidden secret path was correctly rejected."

      - name: Preview Recovery In Isolation
        shell: bash
        run: |
          cd "$TEST_ROOT"
          RECOVERY_MODE=preview node core-recovery.js

          node - <<'NODE'
          const plan = require(process.env.TEST_ROOT + '/recovery-plan.json');
          if (plan.summary.actionsRequired !== 1) {
            throw new Error(`Expected 1 recovery action, got ${plan.summary.actionsRequired}`);
          }
          NODE

          grep -qx 'CURRENT VERSION' README.md
          echo "Preview changed no files."

      - name: Apply Recovery In Isolation
        shell: bash
        run: |
          cd "$TEST_ROOT"
          RECOVERY_MODE=apply RECOVERY_CONFIRMATION=RESTORE_KINGS node core-recovery.js

          grep -qx 'BACKUP VERSION' README.md

          node - <<'NODE'
          const result = require(process.env.TEST_ROOT + '/recovery-result.json');
          if (result.status !== 'SUCCESS' || result.restoredFiles !== 1) {
            throw new Error('Isolated APPLY did not complete successfully.');
          }
          NODE

          echo "Isolated APPLY restored exactly one file successfully."

name: One-time Kings Logo Migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-logo-migration.yml'

permissions:
  contents: write

concurrency:
  group: kings-logo-migration
  cancel-in-progress: false

jobs:
  migrate-logo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Replace old Kings logo in active systems
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          workflow = Path('.github/workflows/one-time-logo-migration.yml')
          new_logo = '<:Kings_Logistics_Logo:1545254529648431124>'
          old_exact = '<:KingsLogisticsLogo:1394506239920177243>'
          old_named = re.compile(r'<a?:KingsLogisticsLogo:\d+>|:KingsLogisticsLogo:')
          allowed_suffixes = {'.js', '.cjs', '.mjs', '.yml', '.yaml', '.json', '.md', '.txt'}
          excluded_roots = {'.git', 'data', 'output', 'node_modules'}

          changed = []
          replacements = 0

          for path in root.rglob('*'):
              if not path.is_file() or path == workflow:
                  continue
              if path.suffix.lower() not in allowed_suffixes:
                  continue
              if any(part in excluded_roots for part in path.parts):
                  continue

              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              count_exact = text.count(old_exact)
              updated = text.replace(old_exact, new_logo)
              updated, count_named = old_named.subn(new_logo, updated)
              count = count_exact + count_named

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count

          print(f'Logo replacements: {replacements}')
          if changed:
              print('Changed system files:')
              for path in changed:
                  print(f' - {path}')
          else:
              print('No active system file still contained the old Kings logo token.')
          PY

      - name: Remove one-time migration workflow
        run: rm -f .github/workflows/one-time-logo-migration.yml

      - name: Save logo migration
        shell: bash
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update Kings Logistics logo across systems"
          git pull --rebase origin main
          git push origin main

name: One-time Driver API Resilience

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-api-resilience-driver.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Apply Driver hardening
        run: python3 tools/harden-driver.py

      - name: Validate hardened files
        run: |
          node --check api-resilience.js
          node --check driver-updates.js
          grep -q "resilientFetchJson" driver-updates.js
          grep -q "destructiveChangeConfirmed" driver-updates.js

      - name: Remove temporary migration files
        if: always()
        run: |
          rm -f .github/workflows/one-time-api-resilience-driver.yml
          rm -f tools/harden-driver.py

      - name: Save Driver API hardening
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden Driver Updates against API outages"
          git pull --rebase origin main
          git push origin main

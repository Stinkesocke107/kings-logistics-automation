name: Kings Central Scheduler

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Dispatch all managed workflows immediately if they are stale"
        required: false
        default: true
        type: boolean

  push:
    branches: [main]
    paths:
      - '.github/workflows/central-scheduler.yml'

  # Native cron is now only an emergency bootstrap. The running scheduler
  # maintains its own 5-minute cadence and queues a standby successor.
  schedule:
    - cron: '17,47 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: kings-central-scheduler
  cancel-in-progress: false

jobs:
  scheduler-engine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 325

    steps:
      - name: Verify managed workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in convoy-checker.yml hr-leadership.yml management-overview.yml milestones.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            echo "${workflow}: ${state}"
            test "$state" = "active"
          done

      - name: Queue standby scheduler successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          queued=false
          for attempt in 1 2 3; do
            if gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/central-scheduler.yml/dispatches" \
              -f ref=main \
              -f 'inputs[force_all]=false'; then
              queued=true
              echo "Standby scheduler successor queued on attempt ${attempt}."
              break
            fi
            sleep 5
          done
          test "$queued" = "true"

      - name: Run resilient Kings scheduler loop
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL_INPUT: ${{ inputs.force_all }}
        shell: bash
        run: |
          set -euo pipefail

          latest_managed_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f per_page=10 \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].created_at // ""'
          }

          dispatch_if_due() {
            local workflow="$1"
            local min_age_seconds="$2"
            local mode="${3:-}"
            local latest latest_epoch now age

            latest="$(latest_managed_run "$workflow")"
            now="$(date -u +%s)"

            if [ -n "$latest" ]; then
              latest_epoch="$(date -u -d "$latest" +%s)"
              age=$(( now - latest_epoch ))
              if [ "$age" -lt "$min_age_seconds" ]; then
                echo "${workflow}: fresh managed run ${age}s ago; skipping duplicate dispatch."
                return 0
              fi
            fi

            echo "${workflow}: dispatching now."
            if [ "$workflow" = "convoy-checker.yml" ]; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f "inputs[mode]=${mode:-live}"
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main
            fi
          }

          force_all=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            force_all=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${FORCE_ALL_INPUT:-false}" = "true" ]; then
            force_all=true
          fi

          if [ "$force_all" = "true" ]; then
            echo "Bootstrap health pass: dispatching stale managed workflows immediately."
            dispatch_if_due milestones.yml 240
            dispatch_if_due management-overview.yml 600
            dispatch_if_due hr-leadership.yml 600
            dispatch_if_due convoy-checker.yml 600 live
          fi

          # 60 aligned ticks = about five hours. A queued successor takes over
          # after this job exits. Every tick is realigned to UTC to avoid drift.
          for tick in $(seq 1 60); do
            now="$(date -u +%s)"
            # Scheduler slots are xx:03,08,13,...,58 UTC.
            next=$(( ((now - 180 + 299) / 300) * 300 + 180 ))
            if [ "$next" -le "$now" ]; then
              next=$(( next + 300 ))
            fi
            wait=$(( next - now ))
            echo "Tick ${tick}/60: sleeping ${wait}s until $(date -u -d "@${next}" +%H:%M:%S) UTC."
            sleep "$wait"

            minute=$((10#$(date -u +%M)))
            phase=$(( ((minute - 3 + 60) / 5) % 3 ))
            echo "Scheduler tick at UTC minute ${minute}; phase ${phase}."

            # Milestones every five minutes. The old native cron remains a
            # backup; the freshness gate prevents duplicate dispatches.
            dispatch_if_due milestones.yml 240

            # Staggered 15-minute systems. These phases are intentionally placed
            # shortly after the legacy cron times, so a healthy legacy run wins
            # and the central scheduler only acts as failover.
            case "$phase" in
              0) dispatch_if_due management-overview.yml 600 ;;
              1) dispatch_if_due convoy-checker.yml 600 live ;;
              2) dispatch_if_due hr-leadership.yml 600 ;;
            esac
          done

      - name: Scheduler handoff summary
        if: always()
        run: |
          echo "## Kings Central Scheduler" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Self-sustaining scheduler chain: **enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standby successor: **queued before scheduler loop**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Milestones cadence: **5 minutes**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Management / Convoy / HR cadence: **15 minutes, staggered**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate protection: **latest schedule/workflow_dispatch freshness gate**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native GitHub cron: **emergency bootstrap only**" >> "$GITHUB_STEP_SUMMARY"

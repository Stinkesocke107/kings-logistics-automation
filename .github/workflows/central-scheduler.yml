name: Kings Central Scheduler
# Diagnostic heartbeat: verify the regular recovery path after overdue monitoring alerts.

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run one immediate recovery pass"
        required: false
        default: false
        type: boolean

  push:
    branches: [main]
    paths:
      - '.github/workflows/central-scheduler.yml'

  # One common 5-minute recovery heartbeat. Native producer crons remain
  # deliberately staggered to limit Discord/API bursts and Git commit conflicts.
  schedule:
    - cron: '3-58/5 * * * *'

  # Independent watchdog path: any healthy managed producer can wake the
  # scheduler even when GitHub delays this workflow's own cron.
  workflow_run:
    workflows:
      - "Kings Live Systems"
      - "Kings Driver Updates"
      - "Kings Convoy Checker"
      - "Kings HR Leadership Overview"
      - "Kings Driver Management"
      - "Kings Staff Management"
      - "Kings Consolidated Leadership Dashboard"
      - "Kings Milestone Detector"
      - "Kings System Monitoring"
    types: [completed]

permissions:
  actions: write
  contents: read

# Deliberately no workflow-level concurrency group here. A short idempotent
# recovery pass must not be starved by newer cron/workflow_run events replacing
# an older queued scheduler run before it ever receives a runner.
jobs:
  scheduler-engine:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify managed workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in live-tracker.yml convoy-checker.yml hr-leadership.yml leadership-dashboard.yml milestones.yml driver-management.yml staff-management.yml driver-updates.yml news.yml social-news.yml changelog.yml staff-leadership-live-overview.yml convoy-announcement-verifier.yml self-healing.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            echo "${workflow}: ${state}"
            test "$state" = "active"
          done

      - name: Run one resilient scheduler pass
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL_INPUT: ${{ inputs.force_all }}
        shell: bash
        run: |
          set -euo pipefail

          managed_run_snapshot() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f per_page=50
          }

          active_managed_run() {
            local snapshot="$1"
            jq -r '
                  [
                    .workflow_runs[]
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                    | select(
                        .status == "queued" or
                        .status == "in_progress" or
                        .status == "waiting" or
                        .status == "pending" or
                        .status == "requested"
                      )
                  ][0]
                  | if . then "\(.id)|\(.status)|\(.created_at)" else "" end
                ' <<< "$snapshot"
          }

          latest_successful_run() {
            local snapshot="$1"
            jq -r '
                  [
                    .workflow_runs[]
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                    | select(.status == "completed" and .conclusion == "success")
                  ][0].updated_at // ""
                ' <<< "$snapshot"
          }

          latest_completed_run() {
            local snapshot="$1"
            jq -r '
                [
                  .workflow_runs[]
                  | select(.event == "schedule" or .event == "workflow_dispatch")
                  | select(.status == "completed")
                ][0].updated_at // ""
              ' <<< "$snapshot"
          }

          dispatch_if_due() {
            local workflow="$1"
            local max_success_age_seconds="$2"
            local mode="${3:-}"
            local max_active_age_seconds="${4:-1200}"
            local active active_id active_status active_created active_epoch active_age
            local latest_success latest_epoch latest_completed completed_epoch now age snapshot

            now="$(date -u +%s)"
            # One API read per producer per pass, not two or three. This also
            # makes active/freshness/cooldown decisions use the same run list.
            snapshot="$(managed_run_snapshot "$workflow")"
            active="$(active_managed_run "$snapshot")"
            if [ -n "$active" ]; then
              IFS='|' read -r active_id active_status active_created <<< "$active"
              active_age=0
              if [ -n "$active_created" ]; then
                active_epoch="$(date -u -d "$active_created" +%s)"
                active_age=$(( now - active_epoch ))
              fi

              if [ "$active_age" -le "$max_active_age_seconds" ]; then
                echo "${workflow}: active managed run ${active_id} (${active_status}, ${active_age}s old); no duplicate dispatch."
                return 0
              fi

              echo "::warning::${workflow}: managed run ${active_id} is still ${active_status} after ${active_age}s; treating it as stuck and allowing one recovery dispatch."
            fi

            latest_success="$(latest_successful_run "$snapshot")"

            if [ -n "$latest_success" ]; then
              latest_epoch="$(date -u -d "$latest_success" +%s)"
              age=$(( now - latest_epoch ))
              if [ "$age" -lt "$max_success_age_seconds" ]; then
                echo "${workflow}: last successful managed run is ${age}s old; still healthy."
                return 0
              fi
            fi

            # If the latest execution failed, wait a few minutes before retrying.
            # Without a cooldown, unrelated workflow_run wake-ups could create
            # a storm of failing dispatches and unnecessary GitHub API calls.
            if [ "$max_success_age_seconds" -gt 0 ]; then
              latest_completed="$(latest_completed_run "$snapshot")"
              if [ -n "$latest_completed" ]; then
                completed_epoch="$(date -u -d "$latest_completed" +%s)"
                if [ $(( now - completed_epoch )) -lt 300 ]; then
                  echo "${workflow}: recently completed a managed run; observing 5-minute recovery cooldown."
                  return 0
                fi
              fi
            fi

            echo "${workflow}: overdue with no recent active run; dispatching one safe recovery."
            if [ "$workflow" = "convoy-checker.yml" ]; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f "inputs[mode]=${mode:-live}"
            elif [ "$workflow" = "social-news.yml" ]; then
              # Never enable the explicit one-time historical-video test.
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f 'inputs[verify_connections_only]=false' \
                -f 'inputs[post_latest_test]=false'
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main
            fi
          }

          echo "Running short Kings scheduler recovery pass."

          force_all=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${FORCE_ALL_INPUT:-false}" = "true" ]; then
            force_all=true
            echo "Manual force_all recovery requested."
          fi

          if [ "$force_all" = "true" ]; then
            # Active-run protection still prevents duplicate work. A zero freshness
            # threshold means every non-active managed workflow is dispatched once.
            dispatch_if_due live-tracker.yml 0
            dispatch_if_due milestones.yml 0
            dispatch_if_due convoy-checker.yml 0 live
            dispatch_if_due hr-leadership.yml 0
            dispatch_if_due driver-management.yml 0
            dispatch_if_due staff-management.yml 0
            dispatch_if_due leadership-dashboard.yml 0
            dispatch_if_due driver-updates.yml 0
            dispatch_if_due news.yml 0
            dispatch_if_due social-news.yml 0
            dispatch_if_due changelog.yml 0
            # Technical/read-only recovery tools only; no forced probation,
            # personnel approval, restore/import or disciplinary action.
            dispatch_if_due staff-leadership-live-overview.yml 0
            dispatch_if_due convoy-announcement-verifier.yml 0
            dispatch_if_due self-healing.yml 0
          else
            # Native cadence is normally faster than these recovery thresholds.
            dispatch_if_due live-tracker.yml 540
            dispatch_if_due milestones.yml 540
            dispatch_if_due convoy-checker.yml 900 live
            dispatch_if_due hr-leadership.yml 1200
            dispatch_if_due driver-management.yml 4500
            dispatch_if_due staff-management.yml 1200
            dispatch_if_due leadership-dashboard.yml 46800
            # Recover delayed data/news workflows without adding independent
            # timers or coupling their failure domains.
            dispatch_if_due driver-updates.yml 720
            dispatch_if_due news.yml 720
            dispatch_if_due social-news.yml 1200
            dispatch_if_due changelog.yml 1800
            # Read-only live Staff counts, read-only Convoy proof verifier and
            # bounded technical Self-Healing. Native clocks stay preferred.
            dispatch_if_due staff-leadership-live-overview.yml 4500
            dispatch_if_due convoy-announcement-verifier.yml 7200
            dispatch_if_due self-healing.yml 5400
          fi

          echo "Scheduler pass complete. No long-running sleep loop remains."

      - name: Scheduler summary
        if: always()
        run: |
          {
            echo "## Kings Central Scheduler"
            echo ""
            echo "- Architecture: **short idempotent recovery scheduler with redundant watchdog triggers**"
            echo "- Runtime target: **well under 5 minutes**"
            echo "- Schedule: **every 5 minutes + workflow_run watchdog wake-ups**"
            echo "- Long-running 5-hour scheduler: **removed**"
            echo "- Scheduler queue starvation protection: **no self-concurrency replacement**"
            echo "- Active-run protection: **recent queued / pending / in-progress workflows are not duplicated; stuck runs expire after 20 minutes**"
            echo "- Convoy recovery threshold: **15 minutes**; HR recovery threshold: **20 minutes**"
            echo "- Driver recovery threshold: **75 minutes**"
            echo "- Staff recovery threshold: **20 minutes**"
            echo "- Leadership Overview recovery threshold: **13 hours**"
            echo "- Shared safe recovery covers Driver Updates, News, Changelog, Staff Role Overview, Convoy Announcement Verification and bounded technical Self-Healing." 
            echo "- Failed jobs have a 5-minute retry cooldown; one GitHub API snapshot per producer." 
            echo "- Code pushes never force mass producer dispatch; only explicit force_all does." 
            echo "- Native producer crons remain preferred and staggered for safety."
          } >> "$GITHUB_STEP_SUMMARY"

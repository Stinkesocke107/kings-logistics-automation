name: Kings Central Scheduler

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run one immediate recovery pass"
        required: false
        default: false
        type: boolean

  push:
    branches: [main]
    paths:
      - '.github/workflows/central-scheduler.yml'

  # Short fallback/recovery pass every 5 minutes. Native workflow crons remain
  # the preferred producers; this scheduler only fills genuine gaps.
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: kings-central-scheduler
  # Replacing the former multi-hour scheduler must immediately free the runner.
  cancel-in-progress: true

jobs:
  scheduler-engine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify managed workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in live-tracker.yml convoy-checker.yml hr-leadership.yml leadership-overviews.yml milestones.yml driver-management.yml staff-management.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            echo "${workflow}: ${state}"
            test "$state" = "active"
          done

      - name: Run one resilient scheduler pass
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL_INPUT: ${{ inputs.force_all }}
        shell: bash
        run: |
          set -euo pipefail

          managed_run_snapshot() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f per_page=20
          }

          active_managed_run() {
            local workflow="$1"
            managed_run_snapshot "$workflow" \
              | jq -r '
                  [
                    .workflow_runs[]
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                    | select(
                        .status == "queued" or
                        .status == "in_progress" or
                        .status == "waiting" or
                        .status == "pending" or
                        .status == "requested"
                      )
                  ][0]
                  | if . then "\(.id)|\(.status)|\(.created_at)" else "" end
                '
          }

          latest_successful_run() {
            local workflow="$1"
            managed_run_snapshot "$workflow" \
              | jq -r '
                  [
                    .workflow_runs[]
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                    | select(.status == "completed" and .conclusion == "success")
                  ][0].updated_at // ""
                '
          }

          dispatch_if_due() {
            local workflow="$1"
            local max_success_age_seconds="$2"
            local mode="${3:-}"
            local active latest_success latest_epoch now age

            active="$(active_managed_run "$workflow")"
            if [ -n "$active" ]; then
              echo "${workflow}: active managed run ${active}; no duplicate dispatch."
              return 0
            fi

            latest_success="$(latest_successful_run "$workflow")"
            now="$(date -u +%s)"

            if [ -n "$latest_success" ]; then
              latest_epoch="$(date -u -d "$latest_success" +%s)"
              age=$(( now - latest_epoch ))
              if [ "$age" -lt "$max_success_age_seconds" ]; then
                echo "${workflow}: last successful managed run is ${age}s old; still healthy."
                return 0
              fi
            fi

            echo "${workflow}: stale with no active run; dispatching recovery."
            if [ "$workflow" = "convoy-checker.yml" ]; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f "inputs[mode]=${mode:-live}"
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main
            fi
          }

          echo "Running short Kings scheduler recovery pass."

          # A scheduler-code deployment performs one immediate Driver/Staff
          # recovery pass. Active-run protection still prevents duplicates.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Scheduler deployment bootstrap: validating Driver and Staff Management immediately."
            dispatch_if_due driver-management.yml 0
            dispatch_if_due staff-management.yml 0
          fi

          # Native cadence is normally faster than these recovery thresholds.
          dispatch_if_due live-tracker.yml 540
          dispatch_if_due milestones.yml 540
          dispatch_if_due convoy-checker.yml 1200 live
          dispatch_if_due hr-leadership.yml 1200
          dispatch_if_due driver-management.yml 4500
          dispatch_if_due staff-management.yml 4500
          dispatch_if_due leadership-overviews.yml 46800

          echo "Scheduler pass complete. No long-running sleep loop remains."

      - name: Scheduler summary
        if: always()
        run: |
          {
            echo "## Kings Central Scheduler"
            echo ""
            echo "- Architecture: **short single-pass recovery scheduler**"
            echo "- Runtime target: **well under 5 minutes**"
            echo "- Schedule: **every 5 minutes**"
            echo "- Long-running 5-hour scheduler: **removed**"
            echo "- Active-run protection: **queued / pending / in-progress workflows are never duplicated**"
            echo "- Convoy / HR recovery threshold: **20 minutes**"
            echo "- Driver / Staff recovery threshold: **75 minutes**"
            echo "- Leadership Overview recovery threshold: **13 hours**"
            echo "- Native workflow crons remain the preferred cadence."
          } >> "$GITHUB_STEP_SUMMARY"

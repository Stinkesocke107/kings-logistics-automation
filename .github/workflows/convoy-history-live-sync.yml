name: Kings Convoy History Live Sync

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      publish_to_discord:
        description: "Publish/update the public convoy statistics message"
        required: true
        default: true
        type: boolean

  push:
    branches:
      - feature/convoy-history-v1
    paths:
      - 'convoy-history.js'
      - 'convoy-history-discord.js'
      - 'convoy-history-import.js'
      - 'convoy-history-truckersmp-candidates.js'
      - 'tests/convoy-history.test.cjs'
      - 'data/convoy-history-2024-scan.json'
      - 'data/convoy-history-backfill.json'
      - '.github/workflows/convoy-history-live-sync.yml'

permissions:
  contents: write

concurrency:
  group: kings-convoy-history-live-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify convoy history scripts
        run: |
          node --check convoy-history.js
          node --check convoy-history-discord.js
          node --check convoy-history-import.js
          node --check convoy-history-truckersmp-candidates.js

      - name: Run convoy history tests
        run: node --test tests/convoy-history.test.cjs

      - name: Discover current TruckersMP events
        env:
          KINGS_VTC_ID: '64284'
          KINGS_CONVOY_HISTORY_FROM: '2023-01-01'
          KINGS_CONVOY_HISTORY_CANDIDATES: 'data/convoy-history-truckersmp-candidates.json'
        run: node convoy-history-truckersmp-candidates.js

      - name: Import and advance event lifecycle
        run: node convoy-history-import.js

      - name: Generate live statistics
        run: node convoy-history.js

      - name: Show current year and monthly split
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const stats = JSON.parse(fs.readFileSync('output/convoy-history-statistics.json', 'utf8'));
          const now = new Date(stats.generatedAt);
          const year = String(now.getUTCFullYear());
          const current = stats.years?.[year] || { total: 0, own: 0, external: 0 };
          console.log(`${year} total: ${current.total} | Kings: ${current.own} | External: ${current.external}`);
          for (let month = 1; month <= now.getUTCMonth() + 1; month += 1) {
            const key = `${year}-${String(month).padStart(2, '0')}`;
            const value = stats.months?.[key] || { total: 0, own: 0, external: 0 };
            console.log(`${key}: ${value.total} total | ${value.own} Kings | ${value.external} external`);
          }
          NODE

      - name: Persist live convoy history
        shell: bash
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/convoy-history-truckersmp-candidates.json data/convoy-history.json
          if git diff --cached --quiet; then
            echo "No live convoy history changes to save."
          else
            git commit -m "Update live convoy history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish/update Discord convoy statistics
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_discord == true) }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CONVOY_STATISTICS_CHANNEL_ID: '1558352669071118467'
        shell: bash
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "DISCORD_BOT_TOKEN is not configured; skipping Discord publish."
            exit 0
          fi
          node convoy-history-discord.js

      - name: Upload live statistics audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kings-convoy-history-live-sync
          path: |
            output/convoy-history-statistics.json
            output/convoy-history-statistics.md
          if-no-files-found: warn
          retention-days: 7

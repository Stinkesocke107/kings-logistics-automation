name: Kings Live Systems

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-tracker.yml'
      - 'tracker.js'
      - 'statistics.js'
      - 'central-overview.js'
      - 'api-resilience.js'
      - 'kings-branding.js'
      - 'scripts/git-safe-push.sh'

  schedule:
    # Every 5 minutes, shifted away from :00 / :05 / :10...
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-live-systems
  cancel-in-progress: false

jobs:
  update-live-systems:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'live-systems'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Update Kings Live Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node tracker.js

      - name: Update Kings Advanced Statistics
        env:
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
        run: |
          node statistics.js

          # statistics.json stores historical/hourly data and therefore may not
          # otherwise change on every 5-minute run. Keep updatedAt as a health
          # heartbeat for the last successful Statistics processing run.
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/statistics.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.updatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n', 'utf8');
          console.log(`Statistics heartbeat updated: ${data.updatedAt}`);
          NODE

      - name: Update Kings Central Overview
        env:
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node central-overview.js

      - name: Save Kings Live System Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/live-tracker-snapshot.json data/statistics.json data/central-overview.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          bash scripts/git-safe-push.sh main

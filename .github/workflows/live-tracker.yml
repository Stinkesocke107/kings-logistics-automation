name: Kings Live Systems

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-tracker.yml'
      - 'tracker.js'
      - 'statistics.js'
      - 'central-overview.js'
      - 'api-resilience.js'
      - 'kings-branding.js'
      - 'scripts/git-safe-push.sh'

  schedule:
    # One complete live-state refresh per 5-minute schedule.
    # Do not delay state persistence by holding a run open for 150 seconds.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-live-systems
  # A delayed run must never build a stale queue behind the newest live data.
  cancel-in-progress: true

jobs:
  update-live-systems:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINGS_API_HEALTH_NAMESPACE: 'live-systems'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Update Kings Live Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node tracker.js

      - name: Update Kings Advanced Statistics
        env:
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
        run: node statistics.js

      - name: Verify Tracker and Statistics use the same source generation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tracker = JSON.parse(fs.readFileSync('data/live-tracker-snapshot.json', 'utf8'));
          const stats = JSON.parse(fs.readFileSync('data/statistics.json', 'utf8'));
          if (!tracker.updatedAt || stats.sourceSnapshotAt !== tracker.updatedAt) {
            throw new Error('Kings live-source mismatch: refusing to publish mixed-time dashboard data.');
          }
          console.log('Verified shared Kings Tracker source: ' + tracker.updatedAt);
          NODE

      - name: Update Kings Central Overview
        env:
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node central-overview.js

      - name: Save Kings Live System Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/live-tracker-snapshot.json data/statistics.json data/central-overview.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          if ! bash scripts/git-safe-push.sh main; then
            echo "::warning::Live system state changed concurrently. Keeping the newer remote state; Discord Live Tracker/Statistics updates already completed successfully."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            exit 0
          fi

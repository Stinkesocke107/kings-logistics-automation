name: Kings Live Systems

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-tracker.yml'
      - 'tracker.js'
      - 'scripts/map-provider-diagnostic.js'
      - 'tracker-driver-identity.js'
      - 'driver-loyalty-register.js'
      - 'driver-identity-register.js'
      - 'live-outage-notice.js'
      - 'truckersmp-official-live.js'
      - 'statistics.js'
      - 'central-overview.js'
      - 'api-resilience.js'
      - 'kings-branding.js'
      - 'scripts/git-safe-push.sh'

  schedule:
    # One complete live-state refresh per 5-minute schedule.
    # Do not delay state persistence by holding a run open for 150 seconds.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-live-systems
  # A delayed run must never build a stale queue behind the newest live data.
  cancel-in-progress: true

jobs:
  update-live-systems:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINGS_API_HEALTH_NAMESPACE: 'live-systems'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Limited, read-only candidate sampling on the specific one-time change.
      # Never activate a backup based on this result. No member names/IDs
      # or positions are written to logs, files or Discord.
      - name: One-time Doko and Trucky candidate diagnostics
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'One-time source probe')
        continue-on-error: true
        run: node scripts/map-provider-diagnostic.js

      - name: Update Kings Live Tracker
        id: live_tracker
        # A map/provider incident must not halt the whole Kings Live Systems
        # pipeline before the independently verified fallback can publish.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_LOYALTY_REGISTER_CHANNEL_ID: '1572736232969084948'
          TRACKER_IDENTITY_SYNC_ENABLED: 'true'
        run: node tracker.js

      # A failed map scan uses an independent, real-time official TMP feed.
      # It updates only the three existing Discord messages, with Kings online
      # explicitly unavailable, without resetting their verified history.
      # If even the stored Tracker message cannot be edited, fail the job.
      - name: Continue Kings Live Systems without the live map
        if: ${{ steps.live_tracker.outcome == 'failure' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
          # Official server totals and Kings VTC membership only. Neither
          # field claims to identify Kings Drivers currently in game.
          TRUCKERSMP_OFFICIAL_FEED_ENABLED: 'true'
        run: |
          node live-outage-notice.js
          echo "::warning::Live player data unavailable; Kings Live Tracker is operating in verified offline-map mode."
          echo "### Kings Live Systems: operating without live player map" >> "$GITHUB_STEP_SUMMARY"
          echo "Official VTC membership and global TruckersMP server totals are shown when verified. Kings-specific live player counts are unavailable, not zero. No historic live snapshot was overwritten." >> "$GITHUB_STEP_SUMMARY"

      - name: Update Kings Advanced Statistics
        if: ${{ steps.live_tracker.outcome == 'success' }}
        env:
          STATS_DISCORD_WEBHOOK_URL: ${{ secrets.STATS_DISCORD_WEBHOOK_URL }}
        run: node statistics.js

      - name: Verify Tracker and Statistics use the same source generation
        if: ${{ steps.live_tracker.outcome == 'success' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tracker = JSON.parse(fs.readFileSync('data/live-tracker-snapshot.json', 'utf8'));
          const stats = JSON.parse(fs.readFileSync('data/statistics.json', 'utf8'));
          if (!tracker.updatedAt || stats.sourceSnapshotAt !== tracker.updatedAt) {
            throw new Error('Kings live-source mismatch: refusing to publish mixed-time dashboard data.');
          }
          console.log('Verified shared Kings Tracker source: ' + tracker.updatedAt);
          NODE

      - name: Update Kings Central Overview
        if: ${{ steps.live_tracker.outcome == 'success' }}
        env:
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node central-overview.js

      - name: Save Kings Live System Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/live-tracker-snapshot.json data/statistics.json data/central-overview.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          if ! bash scripts/git-safe-push.sh main; then
            echo "::warning::Live system state changed concurrently. Keeping the newer remote state; Discord Live Tracker/Statistics updates already completed successfully."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            exit 0
          fi

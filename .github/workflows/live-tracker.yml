name: Kings Live Systems

on:
  workflow_dispatch:

  schedule:
    # Every 5 minutes, shifted away from :00 / :05 / :10...
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-live-systems
  cancel-in-progress: true

jobs:
  update-live-systems:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update Kings Live Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node tracker.js

      - name: Update Kings Advanced Statistics
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          STATS_CHANNEL_ID: '1543539008771063818'
        run: node statistics.js

      - name: Update Kings Central Overview
        env:
          CENTRAL_OVERVIEW_WEBHOOK_URL: ${{ secrets.CENTRAL_OVERVIEW_WEBHOOK_URL }}
        run: node central-overview.js

      - name: Save Kings Live System Data
        run: |
          if git diff --quiet -- \
            data/live-tracker-snapshot.json \
            data/statistics.json \
            data/central-overview.json \
            && [ -z "$(git status --porcelain \
              data/live-tracker-snapshot.json \
              data/statistics.json \
              data/central-overview.json)" ]; then

            echo "No Kings Live System data changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/live-tracker-snapshot.json
          git add data/statistics.json
          git add data/central-overview.json

          git commit -m "Update Kings Live Systems"

          git pull --rebase origin main
          git push origin main

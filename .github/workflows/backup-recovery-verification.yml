name: Kings Backup Recovery Verification

on:
  workflow_dispatch:
  # Disposable backup+SHA256 restore on proposed code before main merge.
  # No real restore, production secrets, state commits or Discord writes.
  pull_request:
    paths:
      - 'core-backup.js'
      - 'backup-final-check.js'
      - 'backup-restore-verify.js'
      - 'backup-artifact-verifier.js'
      - 'recovery-path-guard.js'
      - '.github/workflows/core-backup.yml'
      - '.github/workflows/core-recovery.yml'
      - '.github/workflows/backup-recovery-verification.yml'
      - 'tests/recovery-path-guard.test.cjs'
  push:
    branches: [main]
    paths:
      - 'core-backup.js'
      - 'core-recovery.js'
      - 'recovery-path-guard.js'
      - 'recovery-safety-check.js'
      - 'tests/recovery-path-guard.test.cjs'
      - 'backup-final-check.js'
      - 'backup-restore-verify.js'
      - '.github/workflows/core-backup.yml'
      - '.github/workflows/core-recovery.yml'
      - '.github/workflows/backup-recovery-verification.yml'

permissions:
  contents: read

concurrency:
  group: kings-backup-recovery-verification
  cancel-in-progress: false

jobs:
  verify-roundtrip:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Prove recovery path guard with isolated real CLI tests
        run: |
          node --check recovery-path-guard.js
          node --check core-recovery.js
          node --check backup-restore-verify.js
          node --test tests/recovery-path-guard.test.cjs

      - name: Build current Kings backup
        run: node core-backup.js

      - name: Validate backup and perform isolated full restore
        run: node backup-final-check.js

      - name: Enforce restore verification health
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const core = JSON.parse(fs.readFileSync('backup-staging/backup-health.json', 'utf8'));
          const final = JSON.parse(fs.readFileSync('backup-staging/backup-final-health.json', 'utf8'));
          const restore = JSON.parse(fs.readFileSync('backup-staging/backup-restore-verification.json', 'utf8'));

          if (core.healthy !== true) throw new Error('Core backup health is not HEALTHY.');
          if (final.healthy !== true) throw new Error('Final dynamic backup health is not HEALTHY.');
          if (restore.healthy !== true) throw new Error('Isolated restore verification is not HEALTHY.');
          if (restore.summary.manifestFiles !== restore.summary.restoredFiles) throw new Error('Not all manifest files were restored.');
          if (restore.summary.manifestFiles !== restore.summary.checksumsVerified) throw new Error('Not all restored files passed SHA-256 verification.');

          console.log(`Core backup: ${core.status}`);
          console.log(`Final backup: ${final.status}`);
          console.log(`Restore roundtrip: ${restore.status}`);
          console.log(`Restored: ${restore.summary.restoredFiles}/${restore.summary.manifestFiles}`);
          console.log(`SHA-256 verified: ${restore.summary.checksumsVerified}/${restore.summary.manifestFiles}`);
          console.log(`Restored JSON verified: ${restore.summary.restoredJsonVerified}`);
          NODE

      - name: Verify essential automation sources, tests and procedures are actually restorable
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const manifest=JSON.parse(fs.readFileSync('backup-staging/backup-manifest.json','utf8'));
          const restore=JSON.parse(fs.readFileSync('backup-staging/backup-restore-verification.json','utf8'));
          const recorded=new Map((manifest.files||[]).map(x=>[x.path,x]));
          const required=[
            'scripts/git-safe-push.sh',
            'scripts/migrate-event-leadership-state.js',
            'tests/sandbox.cjs',
            'tests/all-kings-workflows.test.cjs',
            'docs/KINGS-ALL-SYSTEMS-INVENTORY.md',
            'docs/KINGS-SYSTEM-UND-FUNKTIONSABNAHME-2026-11-26.md',
            'kings-system-acceptance.js',
            'event-review-dashboard-readonly-proof.js',
            'recovery-path-guard.js',
            'tests/recovery-path-guard.test.cjs'
          ];
          if(restore.healthy!==true||restore.summary.manifestFiles!==restore.summary.restoredFiles||
             restore.summary.manifestFiles!==restore.summary.checksumsVerified)
            throw Error('Kings restored archive does not match original manifest');
          for(const name of required){
            const row=recorded.get(name);
            if(!row||!/^\d+$/.test(String(row.size))||
               !/^[a-f0-9]{64}$/.test(String(row.sha256||'')))
              throw Error('Required Kings recovery component missing from the backup manifest');
            const file=path.join('backup-staging',name);
            const bytes=fs.readFileSync(file);
            if(bytes.length!==row.size||
               crypto.createHash('sha256').update(bytes).digest('hex')!==row.sha256)
              throw Error('A required Kings recovery component is not intact');
          }
          console.log('All essential Kings scripts, tests and operator docs included and restored with SHA-256 proof.');
          NODE

      - name: Verify disposable restore sandbox was removed
        shell: bash
        run: |
          if [ -e restore-verification ]; then
            echo 'ERROR: disposable restore-verification directory still exists.'
            exit 1
          fi
          echo 'Disposable restore sandbox was removed successfully.'

      - name: Upload backup recovery verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-backup-recovery-verification-${{ github.run_number }}
          path: |
            backup-staging/backup-manifest.json
            backup-staging/backup-health.json
            backup-staging/backup-final-health.json
            backup-staging/backup-restore-verification.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          echo '## Kings Backup Recovery Verification' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f backup-staging/backup-restore-verification.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const restore = JSON.parse(fs.readFileSync('backup-staging/backup-restore-verification.json', 'utf8'));
          console.log(`- Status: **${restore.status}**`);
          console.log(`- Restored files: **${restore.summary.restoredFiles}/${restore.summary.manifestFiles}**`);
          console.log(`- SHA-256 verified: **${restore.summary.checksumsVerified}/${restore.summary.manifestFiles}**`);
          console.log(`- JSON files parsed after restore: **${restore.summary.restoredJsonVerified}**`);
          console.log('- Live repository overwritten: **No**');
          console.log('- Disposable restore sandbox removed: **Yes**');
          NODE
          else
            echo '- Restore verification result: **missing**' >> "$GITHUB_STEP_SUMMARY"
          fi

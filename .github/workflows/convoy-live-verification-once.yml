name: Kings Convoy Live Verification - One Time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoy-live-verification-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-current-convoy-live:
    if: startsWith(github.event.head_commit.message, 'Trigger one-time Convoy live verification')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch current Convoy workflow in live mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/convoy-checker.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"mode":"live"}}'
          echo "Current main Convoy workflow dispatched in explicit live mode."

      - name: Safety summary
        run: |
          echo "This workflow only dispatches the existing convoy-checker.yml workflow once." >> "$GITHUB_STEP_SUMMARY"
          echo "It contains no Convoy business logic of its own." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification trigger refreshed after non-fatal TruckersMP 404 handling fix." >> "$GITHUB_STEP_SUMMARY"

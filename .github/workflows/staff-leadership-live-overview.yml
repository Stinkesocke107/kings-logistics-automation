name: Kings Staff Leadership Live Overview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['staff-leadership-live-overview.js', '.github/workflows/staff-leadership-live-overview.yml']
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: write
concurrency:
  group: kings-staff-leadership-live-overview
  cancel-in-progress: false
jobs:
  overview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check safety and syntax
        run: node --check staff-leadership-live-overview.js
      - name: Publish or update Staff role overview
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          STAFF_LEADERSHIP_CHANNEL_NAME: 'staff-leadership'
        run: node staff-leadership-live-overview.js
      - name: Save message identifier safely
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/staff-leadership-live-overview.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Staff Leadership live overview state"
          bash scripts/git-safe-push.sh main

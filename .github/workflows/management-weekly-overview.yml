name: Kings Management Weekly Overview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose how the Management Weekly Overview should run"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - publish

  schedule:
    - cron: "30 10 * * 1"

permissions:
  contents: write

concurrency:
  group: kings-management-weekly-overview
  cancel-in-progress: false

jobs:
  create-management-weekly-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Create Kings Management Weekly Overview
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          MANAGEMENT_OVERVIEW_CHANNEL_NAME: 'management-overview'
          CONVOY_MANAGEMENT_FORUM_ID: '1550619824005062697'
          MANAGEMENT_WEEKLY_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        run: node management-weekly-overview.js

      - name: Save Management Weekly Overview Data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') }}
        run: |
          if git diff --quiet -- data/management-weekly-overview-state.json && [ -z "$(git status --porcelain data/management-weekly-overview-state.json)" ]; then
            echo "No Management Weekly Overview state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/management-weekly-overview-state.json
          git commit -m "Update Kings Management Weekly Overview state"

          git pull --rebase origin main
          git push origin main

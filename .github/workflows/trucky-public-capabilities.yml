name: Temporary Kings Trucky Public API Capability Test
on:
  pull_request:
    paths:
      - 'scripts/trucky-public-capabilities.cjs'
      - '.github/workflows/trucky-public-capabilities.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check documented public endpoints without reading player data
        run: node scripts/trucky-public-capabilities.cjs

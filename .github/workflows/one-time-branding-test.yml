name: One-time Kings Branding Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branding-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run Kings branding regression tests
        run: |
          node --check kings-branding.js
          node --test tests/kings-branding.test.cjs

      - name: Remove one-time workflow
        if: always()
        run: rm -f .github/workflows/one-time-branding-test.yml

      - name: Commit cleanup
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'Kings Logistics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Complete Kings branding regression test'
          git pull --rebase origin main
          git push origin main

name: Kings Consolidated Leadership Dashboard

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'leadership-dashboard.js'
      - 'leadership-message-sync.js'
      - '.github/workflows/leadership-dashboard.yml'

  schedule:
    - cron: "15 8,20 * * *"
    - cron: "30 19 * * *"
    - cron: "45 10 * * 1"
    - cron: "30 10 1 * *"

permissions:
  contents: write

concurrency:
  group: kings-consolidated-leadership-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify consolidated dashboard
        run: |
          node --check leadership-message-sync.js
          node --check leadership-dashboard.js

      - name: Update one Leadership message per channel
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node leadership-dashboard.js

      - name: Persist dashboard message IDs
        run: |
          if git diff --quiet -- data/leadership-dashboard-state.json; then
            echo "No dashboard state changes."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/leadership-dashboard-state.json
          git commit -m "Update consolidated Leadership dashboard state"
          git restore --worktree .
          rm -f data/api-health/truckersmp-vtc-members.json data/api-health/truckersmp-vtc-roles.json
          bash scripts/git-safe-push.sh main

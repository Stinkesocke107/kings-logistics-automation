name: Kings Event Leadership Reports

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Event Leadership report to run"
        required: true
        default: "daily-preview"
        type: choice
        options:
          - invitation-check
          - capacity-check
          - integration-check
          - daily-preview
          - daily-publish
          - weekly-preview
          - weekly-publish
          - monthly-preview
          - monthly-publish

  push:
    branches:
      - main
    paths:
      - 'event-leadership-reports.js'
      - 'event-leadership-observation.js'
      - 'event-invitation-tracker-source.js'
      - 'event-invitation-tracker-readonly-proof.js'
      - 'event-history-leadership-bridge.js'
      - 'event-history-review-agenda.js'
      - 'event-capacity-pilot-source.js'
      - 'event-capacity-real-source-preview.js'
      - 'event-operations-integrated-readonly-proof.js'
      - 'event-operations-manual-review-state.js'
      - 'event-operations-manual-review.js'
      - 'convoy-planning-limits.js'
      - '.github/workflows/event-leadership-reports.yml'

  schedule:
    - cron: "15 19 * * *"
    - cron: "35 10 * * 1"
    - cron: "15 10 1 * *"

env:
  LEADERSHIP_CONSOLIDATED_ONLY: 'true'

permissions:
  contents: write

concurrency:
  group: kings-event-leadership-reports
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify Event Leadership reports and encrypted state migration syntax
        run: |
          node --check event-leadership-reports.js
          node --check event-leadership-state.js
          node --check event-history-leadership-bridge.js
          node --check event-history-review-agenda.js
          node --check event-capacity-pilot-source.js
          node --check event-leadership-observation.js
          node --check event-invitation-tracker-source.js
          node --check event-history-real-source-preview.js
          node --check event-capacity-real-source-preview.js
          node --check event-operations-manual-review-state.js
          node --check event-operations-manual-review.js
          node --check scripts/migrate-event-leadership-state.js

      # Strict read-only operational proof of the newly connected systems.
      # The existing real-source reporting pipeline is reused, but ALL source
      # output is suppressed to avoid private Event data in PUBLIC CI logs.
      # No Discord messages, bookings, approvals or source writes are made.
      - name: Verify real Calendar and History source without public Event data
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'false'
          CONVOY_FINALIZE_WRITE_MODE: 'false'
          KINGS_VTC_NAME: 'Kings Logistics'
        run: |
          set -euo pipefail
          for script in convoy-checker.js convoy-truckersmp-sync.js convoy-finalize.js convoy-overview.js; do
            if ! node "$script" >/dev/null 2>&1; then
              echo "::warning::Kings Event History / Calendar: real source pipeline unavailable; details withheld."
              exit 1
            fi
          done
          node event-history-real-source-preview.js
          node event-capacity-real-source-preview.js

      - name: Migrate existing Event Leadership state to encrypted storage without Discord writes
        env:
          EVENT_LEADERSHIP_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
        run: node scripts/migrate-event-leadership-state.js

      - name: Save encrypted Event Leadership state without rewriting concurrent changes
        run: |
          if git diff --quiet -- data/event-leadership-report-state.json; then
            echo "Event Leadership state already encrypted; no changes to commit."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-leadership-report-state.json
          git commit -m "Migrate Kings Event Leadership state to encrypted storage"
          bash scripts/git-safe-push.sh main

  # Independent read-only visibility probe. Never writes invitations, tags,
  # roles, public logs, or additional messages. An inaccessible/partial source
  # is a warning; it cannot block the existing Event report workflows.
  invitation_source_verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.report == 'invitation-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify private Invitation Tracker Forum GET-only source without public data
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_INVITATION_TAG_IDS: ${{ secrets.DISCORD_INVITATION_TAG_IDS }}
        run: node event-invitation-tracker-readonly-proof.js

  # Staff-initiated, protected source proof for #12 Capacity. This job is
  # GET-only, never publishes Events, pushes state or alters Discord.
  capacity_source_verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.report == 'capacity-check'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build private source through GET-only existing Convoy Center pipeline
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'false'
          CONVOY_FINALIZE_WRITE_MODE: 'false'
          KINGS_VTC_NAME: 'Kings Logistics'
        run: |
          set -euo pipefail
          for script in convoy-checker.js convoy-truckersmp-sync.js convoy-finalize.js convoy-overview.js; do
            if ! node "$script" >/dev/null 2>&1; then
              echo "::warning::Kings Event Capacity: GET-only source pipeline unavailable; details withheld."
              exit 1
            fi
          done
          node event-capacity-real-source-preview.js

  # Independent real-source #12/#14/#15/#16/#18 advisory join. Nothing is
  # committed or sent to Discord, and it cannot approve a Staff decision.
  event_integrated_source_verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.report == 'integration-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A manually requested production acceptance proof must fail visibly.
    # Keep optional push-time diagnostics nonblocking for existing reports.
    continue-on-error: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build original Convoy Center source using GET-only permissions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'false'
          CONVOY_FINALIZE_WRITE_MODE: 'false'
          KINGS_VTC_NAME: 'Kings Logistics'
        run: |
          set -euo pipefail
          for script in convoy-checker.js convoy-truckersmp-sync.js convoy-finalize.js convoy-overview.js; do
            if ! node "$script" >/dev/null 2>&1; then
              echo "::warning::Kings Event cross-system source unavailable; original details withheld."
              exit 1
            fi
          done
      - name: Verify real Capacity History Calendar Invitation and Staff triage
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_INVITATION_TAG_IDS: ${{ secrets.DISCORD_INVITATION_TAG_IDS }}
        run: node event-operations-integrated-readonly-proof.js

      # Independent GET of the actual owner-bot Event dashboard after
      # reading the existing AES-protected source. This checks stored
      # Invitation and Manual Staff fields, but does not assert that a new
      # human command occurred during this read-only verification.
      - name: Independently verify stored Event dashboard fields without writes
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_EVENT_READBACK_REQUIRE_FRESH_SOURCE: 'true'
        run: |
          node --check event-review-dashboard-readonly-proof.js
          node event-review-dashboard-readonly-proof.js

  report:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && inputs.report != 'invitation-check' && inputs.report != 'capacity-check' && inputs.report != 'integration-check'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Resolve Event report mode
        id: mode
        shell: bash
        env:
          INPUT_REPORT: ${{ inputs.report }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_REPORT%-preview}"
            MODE="${MODE%-publish}"
            PREVIEW=false
            case "$INPUT_REPORT" in
              *-preview) PREVIEW=true ;;
            esac
          elif [ "$EVENT_SCHEDULE" = "15 19 * * *" ]; then
            MODE=daily
            PREVIEW=false
          elif [ "$EVENT_SCHEDULE" = "35 10 * * 1" ]; then
            MODE=weekly
            PREVIEW=false
          else
            MODE=monthly
            PREVIEW=false
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Build fresh read-only Event Leadership data
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'false'
          KINGS_VTC_NAME: 'Kings Logistics'
          CONVOY_FINALIZE_WRITE_MODE: 'false'
        run: |
          node convoy-checker.js
          node convoy-truckersmp-sync.js
          node convoy-finalize.js
          node convoy-overview.js

      - name: Create Event Leadership report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_EVENT_LEADERSHIP_CHANNEL_ID: '1551675735633297418'
          DISCORD_EVENT_LEADERSHIP_CHANNEL_NAME: 'event-leadership'
          EVENT_LEADERSHIP_REPORT_MODE: ${{ steps.mode.outputs.mode }}
          EVENT_LEADERSHIP_REPORT_PREVIEW: ${{ steps.mode.outputs.preview }}
          EVENT_LEADERSHIP_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_INVITATION_TAG_IDS: ${{ secrets.DISCORD_INVITATION_TAG_IDS }}
        run: node event-leadership-reports.js

      - name: Save Event Leadership report state
        if: ${{ steps.mode.outputs.preview == 'false' }}
        run: |
          if git diff --quiet -- data/event-leadership-report-state.json && [ -z "$(git status --porcelain data/event-leadership-report-state.json)" ]; then
            echo "No Event Leadership report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-leadership-report-state.json
          git commit -m "Update Event Leadership report state"
          bash scripts/git-safe-push.sh main

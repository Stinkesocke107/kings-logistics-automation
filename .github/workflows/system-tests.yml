name: Kings Offline System Verification
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.js', 'tests/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kings-offline-system-verification
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify JavaScript and shell syntax
        run: |
          for file in *.js tests/*.cjs; do node --check "$file"; done
          bash -n scripts/git-safe-push.sh
      - name: Verify Driver and Integrity authority agreement
        run: |
          node -e "const fs=require('fs');const d=fs.readFileSync('driver-updates.js','utf8');const i=fs.readFileSync('data-integrity.js','utf8');const a=d.match(/const DRIVER_AUTHORITY\\s*=\\s*'([^']+)'/);const b=i.match(/const authorityOk = data\\.driverUpdates\\?\\.authority === '([^']+)'/);if(!a||!b||a[1]!==b[1]){console.error('Driver authority mismatch between publisher and monitoring');process.exit(1)}"
      - name: Run isolated regression and integration tests
        run: node --test tests/*.test.cjs

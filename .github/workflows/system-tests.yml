name: Kings Offline System Verification
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.js', 'tests/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      capacity_preview:
        description: 'Run the GitHub-only Event Capacity metadata preview (no Discord or event writes)'
        required: false
        type: boolean
        default: false
      invitation_readonly_probe:
        description: 'Manual GET-only private invitation source check (no messages, Event writes or approvals)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

concurrency:
  group: kings-offline-system-verification
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify JavaScript and shell syntax
        run: |
          for file in *.js tests/*.cjs; do node --check "$file"; done
          bash -n scripts/git-safe-push.sh
      - name: Verify Driver and Integrity authority agreement
        run: |
          node -e "const fs=require('fs');const d=fs.readFileSync('driver-updates.js','utf8');const i=fs.readFileSync('data-integrity.js','utf8');const a=d.match(/const DRIVER_AUTHORITY\\s*=\\s*'([^']+)'/);const b=i.match(/const authorityOk = data\\.driverUpdates\\?\\.authority === '([^']+)'/);if(!a||!b||a[1]!==b[1]){console.error('Driver authority mismatch between publisher and monitoring');process.exit(1)}"
      - name: Run isolated regression and integration tests
        run: node --test tests/*.test.cjs

      # Opt-in on main; automatic only on the separate trusted PR for validation.
      # No Discord/Staff/private-store secret and no artifact downloads.
      - name: Kings Capacity read-only GitHub metadata preview
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.capacity_preview == true) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'main' &&
           github.event.pull_request.head.ref == 'feature/event-capacity-readonly-main-preview-2026-11')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_INPUT_CAPACITY_PREVIEW: ${{ inputs.capacity_preview }}
          KINGS_CAPACITY_READONLY_PREVIEW: 'true'
        run: node event-capacity-readonly-preview.js

      # Restricted public-safe real GitHub metadata diagnostic for PR #143.
      # No Discord bot token, no staff archive or private ledger access.
      - name: Kings Event Capacity safe PR live GitHub metadata preflight
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 143 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feature/event-capacity-foundation-2026-11'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          KINGS_EVENT_CAPACITY_PREFLIGHT_ONLY: 'true'
        run: node event-capacity-github-live-preflight.js

      # Manual opt-in only on reviewed main, NEVER on a PR, push or schedule.
      # A dedicated private channel must be explicitly configured by owner.
      # All output is fixed status strings; no message, user, Event or channel IDs.
      - name: Kings Event Invitation authorized GET-only source inspection
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.invitation_readonly_probe == true
        env:
          KINGS_INVITATION_READONLY_PROBE: 'true'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_EVENT_INVITATION_SOURCE_CHANNEL_ID: ${{ secrets.KINGS_EVENT_INVITATION_SOURCE_CHANNEL_ID }}
          KINGS_EVENT_INVITATION_STAFF_ROLE_IDS: ${{ vars.KINGS_EVENT_INVITATION_STAFF_ROLE_IDS }}
          KINGS_EVENT_INVITATION_ADMIN_ROLE_IDS: ${{ vars.KINGS_EVENT_INVITATION_ADMIN_ROLE_IDS }}
        run: node scripts/event-invitation-readonly-probe.js

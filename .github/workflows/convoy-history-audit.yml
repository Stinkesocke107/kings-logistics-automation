name: Kings Convoy History Audit

on:
  workflow_dispatch:
    inputs:
      publish_to_discord:
        description: "Publish/update the public convoy statistics message"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - feature/convoy-history-v1
    paths:
      - 'convoy-history.js'
      - 'convoy-history-truckersmp-candidates.js'
      - 'convoy-history-discord.js'
      - 'convoy-history-import.js'
      - 'data/convoy-history-manual-evidence.json'
      - 'tests/convoy-history.test.cjs'
      - 'docs/convoy-history-v1.md'
      - '.github/workflows/convoy-history-audit.yml'

permissions:
  contents: write

concurrency:
  group: kings-convoy-history-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify convoy history scripts
        run: |
          node --check convoy-history.js
          node --check convoy-history-truckersmp-candidates.js
          node --check convoy-history-discord.js
          node --check convoy-history-import.js

      - name: Run convoy history tests
        run: node --test tests/convoy-history.test.cjs

      - name: Discover TruckersMP history candidates
        env:
          KINGS_VTC_ID: '64284'
          KINGS_CONVOY_HISTORY_FROM: '2023-01-01'
          KINGS_CONVOY_HISTORY_CANDIDATES: 'data/convoy-history-truckersmp-candidates.json'
        run: node convoy-history-truckersmp-candidates.js

      - name: Import discovered and manual convoy history
        run: node convoy-history-import.js

      - name: Generate current history statistics
        run: node convoy-history.js

      - name: Persist TruckersMP candidate snapshot on development branch
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/convoy-history-truckersmp-candidates.json data/convoy-history.json
          if git diff --cached --quiet; then
            echo "No candidate snapshot changes to save."
            exit 0
          fi
          git commit -m "Update TruckersMP convoy history candidate snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish convoy statistics to Discord
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_discord == true }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CONVOY_STATISTICS_CHANNEL_ID: '1558352669071118467'
        run: node convoy-history-discord.js

      - name: Upload convoy history audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-convoy-history-audit
          path: |
            output/convoy-history-statistics.json
            output/convoy-history-statistics.md
            output/convoy-history-truckersmp-candidates.json
          if-no-files-found: warn
          retention-days: 14

name: Kings Scheduler Registration Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-refresh.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: kings-scheduler-registration-refresh
  cancel-in-progress: false

jobs:
  refresh-schedules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refresh affected workflow registrations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          workflows=(
            "convoy-checker.yml"
            "hr-leadership.yml"
            "management-overview.yml"
            "milestones.yml"
          )

          for workflow in "${workflows[@]}"; do
            echo "Refreshing ${workflow}..."
            gh api --method PUT \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable"
            sleep 2
            gh api --method PUT \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done

      - name: Verify workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          workflows=(
            "convoy-checker.yml"
            "hr-leadership.yml"
            "management-overview.yml"
            "milestones.yml"
          )

          for workflow in "${workflows[@]}"; do
            state="$(gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" \
              --jq '.state')"
            echo "${workflow}: ${state}"
            test "${state}" = "active"
          done

name: Kings Driver Updates

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-driver-updates
  cancel-in-progress: false

jobs:
  check-driver-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Kings Driver Automation
        env:
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
        run: node driver-updates.js

      - name: Save Driver Data
        run: |
          if git diff --quiet -- data/driver-members.json data/driver-history.json && [ -z "$(git status --porcelain data/driver-members.json data/driver-history.json)" ]; then
            echo "No Driver data changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/driver-members.json
          git add data/driver-history.json

          git commit -m "Update Kings Driver data"

          git pull --rebase origin main
          git push origin main

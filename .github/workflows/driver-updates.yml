name: Kings Driver Updates

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/driver-updates.yml'
      - 'driver-updates.js'
      - 'api-resilience.js'
      - 'scripts/git-safe-push.sh'

  schedule:
    # Every 5 minutes, staggered to reduce scheduling congestion
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-driver-updates
  cancel-in-progress: false

jobs:
  driver-updates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'driver-updates'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check Kings Driver Updates
        env:
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node driver-updates.js

      - name: Save Driver Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/driver-members.json data/driver-history.json data/driver-updates-summary.json data/driver-change-guard.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          bash scripts/git-safe-push.sh main

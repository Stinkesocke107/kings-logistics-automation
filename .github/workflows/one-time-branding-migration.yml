name: One-time Kings Discord Branding Migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-branding-migration.yml'

permissions:
  contents: write

concurrency:
  group: kings-branding-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Resolve Kings custom emojis and install branding layer
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const token = process.env.DISCORD_BOT_TOKEN;
          const guildId = process.env.DISCORD_GUILD_ID;
          if (!token) throw new Error('DISCORD_BOT_TOKEN is missing.');

          async function main() {
            const response = await fetch(`https://discord.com/api/v10/guilds/${guildId}/emojis`, {
              headers: {
                Authorization: `Bot ${token}`,
                'User-Agent': 'Kings Logistics Branding Migration/1.0'
              }
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Could not load guild emojis: HTTP ${response.status} ${text.slice(0, 300)}`);
            const emojis = JSON.parse(text);

            const logo = emojis.find((emoji) => emoji.name === 'Kings_Logistics_Logo');
            const heart = emojis.find((emoji) => emoji.name === 'kings_heart');
            if (!logo) throw new Error('Discord emoji Kings_Logistics_Logo was not found in the Kings guild.');
            if (!heart) throw new Error('Discord emoji kings_heart was not found in the Kings guild.');

            console.log(`Resolved Kings_Logistics_Logo -> ${logo.id}`);
            console.log(`Resolved kings_heart -> ${heart.id}`);

            const logoMention = `<${logo.animated ? 'a' : ''}:Kings_Logistics_Logo:${logo.id}>`;
            const heartMention = `<${heart.animated ? 'a' : ''}:kings_heart:${heart.id}>`;

            const helper = `// Kings Logistics central Discord branding.\n// Generated from the live Kings Discord guild emoji registry.\n\nconst KINGS_LOGISTICS_LOGO = ${JSON.stringify(logoMention)};\nconst KINGS_HEART = ${JSON.stringify(heartMention)};\n\nlet installed = false;\n\nfunction replaceBrandText(value) {\n  if (typeof value !== 'string' || !value) return value;\n\n  return value\n    .replace(/<a?:Kings_Logistics_Logo:\\d+>/g, KINGS_LOGISTICS_LOGO)\n    .replace(/:Kings_Logistics_Logo:/g, KINGS_LOGISTICS_LOGO)\n    .replace(/\\bKings_Logistics_Logo\\b/g, KINGS_LOGISTICS_LOGO)\n    .replace(/<a?:kings_heart:\\d+>/g, KINGS_HEART)\n    .replace(/:kings_heart:/g, KINGS_HEART)\n    .replace(/\\bkings_heart\\b/g, KINGS_HEART)\n    .replace(/👑/g, KINGS_LOGISTICS_LOGO)\n    .replace(/💙/g, KINGS_HEART);\n}\n\nfunction transformValue(value) {\n  if (typeof value === 'string') return replaceBrandText(value);\n  if (Array.isArray(value)) return value.map(transformValue);\n  if (!value || typeof value !== 'object') return value;\n\n  const output = {};\n  for (const [key, item] of Object.entries(value)) {\n    // Discord embed footers/authors do not consistently render custom emoji markup.\n    // Keep those text-only sections untouched instead of showing raw <:name:id> text.\n    if ((key === 'footer' || key === 'author') && item && typeof item === 'object') {\n      output[key] = item;\n    } else {\n      output[key] = transformValue(item);\n    }\n  }\n\n  if (typeof output.content === 'string' && /Kings Logistics|Kings Family|Kings Staff|Kings Driver|Kings Convoy|Kings Systems/i.test(output.content)) {\n    if (!output.content.includes(KINGS_LOGISTICS_LOGO) && output.content.length < 1940) {\n      output.content = `${KINGS_LOGISTICS_LOGO} ${output.content}`;\n    }\n    if (!output.content.includes(KINGS_HEART) && output.content.length < 1940) {\n      output.content = `${output.content} ${KINGS_HEART}`;\n    }\n  }\n\n  return output;\n}\n\nfunction isDiscordUrl(input) {\n  try {\n    const raw = typeof input === 'string' || input instanceof URL ? String(input) : String(input?.url || '');\n    const host = new URL(raw).hostname.toLowerCase();\n    return host === 'discord.com' || host.endsWith('.discord.com') || host === 'discordapp.com' || host.endsWith('.discordapp.com');\n  } catch {\n    return false;\n  }\n}\n\nfunction transformBody(body) {\n  if (typeof body === 'string') {\n    try {\n      return JSON.stringify(transformValue(JSON.parse(body)));\n    } catch {\n      return replaceBrandText(body);\n    }\n  }\n\n  if (typeof FormData !== 'undefined' && body instanceof FormData) {\n    const payload = body.get('payload_json');\n    if (typeof payload === 'string') {\n      try {\n        body.set('payload_json', JSON.stringify(transformValue(JSON.parse(payload))));\n      } catch {\n        body.set('payload_json', replaceBrandText(payload));\n      }\n    }\n  }\n\n  return body;\n}\n\nfunction installDiscordBranding() {\n  if (installed) return;\n  installed = true;\n\n  const originalFetch = globalThis.fetch;\n  if (typeof originalFetch !== 'function') {\n    throw new Error('Kings Discord branding requires Node.js global fetch.');\n  }\n\n  globalThis.fetch = async function kingsBrandedFetch(input, init = undefined) {\n    if (!isDiscordUrl(input) || !init || init.body === undefined) {\n      return originalFetch(input, init);\n    }\n\n    const nextInit = { ...init, body: transformBody(init.body) };\n    return originalFetch(input, nextInit);\n  };\n}\n\nmodule.exports = {\n  KINGS_LOGISTICS_LOGO,\n  KINGS_HEART,\n  replaceBrandText,\n  transformValue,\n  installDiscordBranding\n};\n`;

            fs.writeFileSync('kings-branding.js', helper, 'utf8');

            const candidates = fs.readdirSync('.')
              .filter((name) => name.endsWith('.js'))
              .filter((name) => !['kings-branding.js'].includes(name));

            const injected = [];
            for (const file of candidates) {
              let source = fs.readFileSync(file, 'utf8');
              const usesDiscord = /discord\.com|discordapp\.com|DISCORD_[A-Z0-9_]*WEBHOOK|WEBHOOK_URL|\/channels\//i.test(source);
              if (!usesDiscord) continue;
              if (source.includes("require('./kings-branding').installDiscordBranding()") || source.includes('require("./kings-branding").installDiscordBranding()')) continue;
              source = `require('./kings-branding').installDiscordBranding();\n${source}`;
              fs.writeFileSync(file, source, 'utf8');
              injected.push(file);
            }

            console.log(`Branding layer installed in ${injected.length} Discord-facing script(s).`);
            for (const file of injected) console.log(`- ${file}`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          echo 'All JavaScript files passed node --check.'

      - name: Validate branding helper
        shell: bash
        run: |
          node <<'NODE'
          const brand = require('./kings-branding');
          const sample = brand.transformValue({
            content: '👑 Kings Logistics test 💙 :kings_heart: :Kings_Logistics_Logo:',
            embeds: [{ description: '💙 👑' }]
          });
          if (!sample.content.includes('<:') && !sample.content.includes('<a:')) throw new Error('Custom emoji markup was not produced.');
          if (sample.content.includes(':kings_heart:') || sample.content.includes(':Kings_Logistics_Logo:')) throw new Error('Text emoji token remained in output.');
          if (sample.content.includes('💙') || sample.content.includes('👑')) throw new Error('Unicode fallback remained in output.');
          console.log(sample.content);
          console.log('Branding transformation test passed.');
          NODE

      - name: Remove one-time migration workflow
        if: always()
        run: rm -f .github/workflows/one-time-branding-migration.yml

      - name: Commit Kings branding migration
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'Kings Logistics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Standardize Kings Discord custom emoji branding'
          git pull --rebase origin main
          git push origin main

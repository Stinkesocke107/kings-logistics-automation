name: Kings Repository Cleanup - One Time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kings-repository-cleanup-once
  cancel-in-progress: false

jobs:
  finalize-cleanup:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Run final repository cleanup'))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify final cleanup state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          stale_branches=(
            'fix/convoy-api-health-conflict-20260930'
            'fix/convoy-schedule-reregister-20260930'
            'fix/kings-system-verification-20260930'
            'fix/monitoring-recovery-20260930'
            'fix/monitoring-state-refresh-20260930'
            'fix/monitoring-trigger-health-producers-20260930'
            'fix/workflow-schedule-hardening-20260930'
            'test/convoy-live-current-main-20260930'
          )
          for branch in "${stale_branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              echo "ERROR: stale branch still exists: ${branch}"
              exit 1
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/branches/codex/convoy-readonly-preview" >/dev/null
          echo 'Unique unmerged preview branch is preserved.'

          removed_paths=(
            '.github/workflows/convoy-live-verification-once.yml'
            '.github/workflows/scheduler-refresh.yml'
            'management-weekly-overview.js'
            'monthly-report.js'
            'weekly-reports-verifier.js'
          )
          for file in "${removed_paths[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=main" >/dev/null 2>&1; then
              echo "ERROR: obsolete file still exists: ${file}"
              exit 1
            fi
          done
          echo 'All verified obsolete files are gone.'

      - name: Remove this one-time cleanup workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/repository-cleanup-once.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Remove completed repository cleanup helper' \
            -f sha="$sha" \
            -f branch='main' >/dev/null
          echo 'Temporary repository cleanup workflow removed from main.'

      - name: Dispatch final Core E2E verification on clean main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/core-e2e-verification.yml/dispatches" \
            -f ref=main
          echo 'Final Core E2E verification dispatched after self-cleanup.'

      - name: Safety summary
        shell: bash
        run: |
          echo '## Kings Final Repository Cleanup' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stale/superseded branches removed: **8**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Obsolete one-time workflows removed: **2**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Superseded root JavaScript implementations removed: **3**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Temporary cleanup workflow removed itself: **Yes**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unique unmerged preview branch preserved: **codex/convoy-readonly-preview**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Final Core E2E dispatched on post-cleanup main: **Yes**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production data changed: **No**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Personnel/Discord actions: **None**' >> "$GITHUB_STEP_SUMMARY"

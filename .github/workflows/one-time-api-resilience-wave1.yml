name: One-time API Resilience Wave One

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-api-resilience-wave1.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Apply API hardening wave one
        run: python3 tools/harden-api-wave1.py

      - name: Validate hardened files
        run: |
          node --check api-resilience.js
          node --check staff-management.js
          node --check news.js
          node --check tracker.js
          grep -q "resilientFetchJson" staff-management.js
          grep -q "truckersmp-vtc-news" news.js
          grep -q "All live TruckersMP server checks failed" tracker.js

      - name: Remove temporary migration files
        if: always()
        run: |
          rm -f .github/workflows/one-time-api-resilience-wave1.yml
          rm -f tools/harden-api-wave1.py

      - name: Save API hardening wave one
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add API resilience to Staff News and Live Tracker"
          git pull --rebase origin main
          git push origin main

name: Kings HR Weekly Summary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose how the HR Weekly Summary should run"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - publish

  schedule:
    - cron: "15 10 * * 1"

permissions:
  contents: write

concurrency:
  group: kings-hr-weekly-summary
  cancel-in-progress: false

jobs:
  create-hr-weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Create Kings HR Weekly Summary
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
          HR_WEEKLY_SUMMARY_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        run: node hr-weekly-summary.js

      - name: Save HR Weekly Summary Data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') }}
        run: |
          if git diff --quiet -- data/hr-weekly-summary-state.json && [ -z "$(git status --porcelain data/hr-weekly-summary-state.json)" ]; then
            echo "No HR Weekly Summary state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/hr-weekly-summary-state.json
          git commit -m "Update Kings HR Weekly Summary state"

          git pull --rebase origin main
          git push origin main

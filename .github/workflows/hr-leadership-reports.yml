name: Kings HR Leadership Reports

on:
  workflow_dispatch:
    inputs:
      report:
        description: "HR Leadership report to run"
        required: true
        default: "daily-preview"
        type: choice
        options:
          - daily-preview
          - daily-publish
          - monthly-preview
          - monthly-publish

  push:
    branches:
      - main
    paths:
      - 'hr-leadership-reports.js'
      - '.github/workflows/hr-leadership-reports.yml'

  schedule:
    # Daily HR changes, staggered after Driver Leadership.
    - cron: "45 18 * * *"
    # Monthly HR report for the completed month.
    - cron: "45 9 1 * *"

env:
  LEADERSHIP_CONSOLIDATED_ONLY: 'true'

permissions:
  contents: write

concurrency:
  group: kings-hr-leadership-reports
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify HR Leadership reports
        run: node --check hr-leadership-reports.js

  daily:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '45 18 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.report == 'daily-preview' || inputs.report == 'daily-publish'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Create HR Daily Changes
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
          HR_LEADERSHIP_REPORT_MODE: 'daily'
          HR_LEADERSHIP_REPORT_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'daily-preview' }}
        run: node hr-leadership-reports.js

      - name: Save HR Daily Report State
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report == 'daily-publish') }}
        run: |
          if git diff --quiet -- data/hr-leadership-report-state.json && [ -z "$(git status --porcelain data/hr-leadership-report-state.json)" ]; then
            echo "No HR Leadership report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/hr-leadership-report-state.json
          git commit -m "Update HR Leadership daily report state"
          bash scripts/git-safe-push.sh main

  monthly:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '45 9 1 * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.report == 'monthly-preview' || inputs.report == 'monthly-publish'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Create HR Monthly Report
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
          HR_LEADERSHIP_REPORT_MODE: 'monthly'
          HR_LEADERSHIP_REPORT_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'monthly-preview' }}
        run: node hr-leadership-reports.js

      - name: Save HR Monthly Report State
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report == 'monthly-publish') }}
        run: |
          if git diff --quiet -- data/hr-leadership-report-state.json && [ -z "$(git status --porcelain data/hr-leadership-report-state.json)" ]; then
            echo "No HR Leadership report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/hr-leadership-report-state.json
          git commit -m "Update HR Leadership monthly report state"
          bash scripts/git-safe-push.sh main

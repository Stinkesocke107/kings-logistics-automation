name: Kings HR Leadership Overview

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'hr-leadership.js'
      - 'hr-driver-register-status.js'
      - 'hr-probation.js'
      - 'probation.js'
      - 'data/probation-state.json'
      - 'scripts/git-safe-push.sh'
      - '.github/workflows/hr-leadership.yml'

  schedule:
    # Shifted by one minute to force GitHub to register a genuinely new schedule trigger.
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-hr-leadership
  cancel-in-progress: false

jobs:
  hr-leadership:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Resolve the CURRENT main head when the queued producer starts.
          # GitHub event SHA may be stale after an earlier completed run,
          # otherwise protected state can conflict with itself on rebase.
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Verify HR Engines
        run: |
          node --check hr-probation.js
          node --check hr-leadership.js
          node --check hr-driver-register-status.js
          test -f scripts/git-safe-push.sh

      - name: Sync HR Probation Reviews
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          HR_LEADERSHIP_CHANNEL_NAME: 'hr-leadership'
        run: node hr-probation.js

      - name: Save HR Probation Data Safely
        if: always()
        run: |
          if git diff --quiet -- data/hr-probation.json && [ -z "$(git status --porcelain data/hr-probation.json)" ]; then
            echo "No HR Probation data changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/hr-probation.json
          git commit -m "Update Kings HR Probation state"
          # A protected HR/Staff/Driver state change is only successful after
          # its commit reaches remote main. A same-file race must NOT reset
          # the local encrypted state and falsely report workflow success.
          # git-safe-push already retries harmless races and fails closed
          # without overwriting either side on a genuine conflict.
          bash scripts/git-safe-push.sh main

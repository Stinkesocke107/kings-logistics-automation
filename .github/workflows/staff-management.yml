name: Kings Staff Management

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'staff-management.js'
      - '.github/workflows/staff-management.yml'

  schedule:
    # Native hourly run; Kings Central Scheduler provides a 65-minute fallback.
    - cron: "43 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-staff-management
  cancel-in-progress: false

jobs:
  staff-management:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'staff-management'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Update Staff Management
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          STAFF_LEADERSHIP_CHANNEL_NAME: 'staff-leadership'
        run: node staff-management.js

      - name: Save Staff Management Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/staff-management.json data/staff-management-summary.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          bash scripts/git-safe-push.sh main

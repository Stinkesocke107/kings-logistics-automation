name: Kings Staff Management

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'staff-management.js'
      - 'staff-discord-updates.js'
      - '.github/workflows/staff-management.yml'

  schedule:
    # Check Staff changes every 10 minutes; Kings Central Scheduler provides a 20-minute fallback.
    - cron: "3-53/10 * * * *"

permissions:
  contents: write

concurrency:
  group: kings-staff-management
  cancel-in-progress: false

jobs:
  staff-management:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'staff-management'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Manual recovery trigger: post the pending public Staff departure after permissions were granted.
      - name: Determine public Staff Updates mode
        id: staff_updates_mode
        shell: bash
        run: |
          # Every production trigger for this workflow is a real synchronization.
          # The publisher itself remains idempotent and suppresses duplicates.
          MODE="live"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Public Staff Updates mode: $MODE"

      - name: Verify Staff automation syntax
        run: |
          node --check staff-management.js
          node --check staff-discord-updates.js

      - name: Update Staff Management
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          STAFF_LEADERSHIP_CHANNEL_NAME: 'staff-leadership'
          STAFF_LEADERSHIP_OVERVIEW_MODE: 'suppress'
        run: node staff-management.js

      - name: Sync public Staff Updates
        id: public_staff_updates
        continue-on-error: true
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          STAFF_PUBLIC_UPDATES_CHANNEL_ID: '1494095653096128604'
          KINGS_UPDATES_BANNER_URL: ${{ vars.KINGS_UPDATES_BANNER_URL }}
          STAFF_PUBLIC_UPDATES_MODE: ${{ steps.staff_updates_mode.outputs.mode }}
        run: node staff-discord-updates.js

      - name: Public Staff Updates warning
        if: steps.public_staff_updates.outcome == 'failure'
        run: |
          echo "::warning::Public Staff Updates could not be posted. Core Staff Management completed successfully; this auxiliary Discord publishing failure is non-critical."

      - name: Save Staff Management Data and API Health Together
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          for file in data/staff-management.json data/staff-management-summary.json data/staff-discord-updates.json data/staff-discord-updates-summary.json data/api-health; do
            if [ -n "$(git status --porcelain -- "$file")" ]; then
              git add -A -- "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings system and API state"
          if ! bash scripts/git-safe-push.sh main; then
            echo "::warning::State changed concurrently. Keeping the newer remote state and treating this persistence conflict as non-fatal."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            exit 0
          fi

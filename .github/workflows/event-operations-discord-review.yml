name: Kings Event Operations — Discord Staff Review

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Same protected Event-state lock as all normal Event Leadership publishers.
concurrency:
  group: kings-event-leadership-reports
  cancel-in-progress: false

jobs:
  discord_review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify private review worker
        run: |
          node --check event-operations-discord-review-source.js
          node --check event-operations-discord-review.js
          node --check event-operations-manual-review-state.js
          node --check event-leadership-state.js
      - name: Read private Discord Staff commands and update encrypted review state only
        env:
          KINGS_EVENT_DISCORD_REVIEW_ENABLED: ${{ secrets.KINGS_EVENT_DISCORD_REVIEW_ENABLED }}
          KINGS_EVENT_REVIEW_DISCORD_CHANNEL_ID: ${{ secrets.KINGS_EVENT_REVIEW_DISCORD_CHANNEL_ID }}
          KINGS_EVENT_REVIEW_DISCORD_ROLE_IDS: ${{ secrets.KINGS_EVENT_REVIEW_DISCORD_ROLE_IDS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
        run: node event-operations-discord-review.js
      - name: Persist encrypted review state only if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/event-leadership-report-state.json; then
            echo "Kings Event Operations Discord: protected source unchanged."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-leadership-report-state.json
          git commit -m "Record protected Discord Event Operations Staff review progress"
          bash scripts/git-safe-push.sh main

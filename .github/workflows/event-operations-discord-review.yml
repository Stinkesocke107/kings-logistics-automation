name: Kings Event Operations — Discord Staff Review

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      verify_message_access:
        description: "Read-only proof of a human KINGS-EVENT-READ-TEST message (VERIFY_ONLY only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # Dispatch the existing dashboard ONLY after an encrypted Event-state
  # change was committed, not after an idle 10-minute Discord poll.
  actions: write

# Same protected Event-state lock as all normal Event Leadership publishers.
concurrency:
  group: kings-event-leadership-reports
  cancel-in-progress: false

jobs:
  discord_review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify private review worker
        run: |
          node --check event-operations-discord-review-source.js
          node --check event-operations-discord-review.js
          node --check event-operations-manual-review-state.js
          node --check event-leadership-state.js
      - name: Read private Discord Staff commands and update encrypted review state only
        env:
          KINGS_EVENT_DISCORD_REVIEW_ENABLED: ${{ secrets.KINGS_EVENT_DISCORD_REVIEW_ENABLED }}
          KINGS_EVENT_REVIEW_MESSAGE_ACCESS_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_message_access && 'YES' || 'NO' }}
          KINGS_EVENT_REVIEW_DISCORD_CHANNEL_ID: ${{ secrets.KINGS_EVENT_REVIEW_DISCORD_CHANNEL_ID }}
          KINGS_EVENT_REVIEW_DISCORD_ROLE_IDS: ${{ secrets.KINGS_EVENT_REVIEW_DISCORD_ROLE_IDS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
        run: node event-operations-discord-review.js
      - name: Persist encrypted review state only if changed
        id: persist
        run: |
          set -euo pipefail
          if git diff --quiet -- data/event-leadership-report-state.json; then
            echo "Kings Event Operations Discord: protected source unchanged."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-leadership-report-state.json
          git commit -m "Record protected Discord Event Operations Staff review progress"
          bash scripts/git-safe-push.sh main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Actions pushes made with GITHUB_TOKEN do NOT trigger normal push
      # workflows. Explicit workflow_dispatch is the supported exception.
      # Only a changed, safely persisted encrypted journal justifies
      # refreshing the one existing consolidated Leadership dashboard.
      - name: Refresh Leadership dashboard when protected review changed
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run leadership-dashboard.yml --repo "$GITHUB_REPOSITORY" --ref main

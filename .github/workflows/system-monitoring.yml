# Repository security, Discord permission audits, API resilience, and the live Discord monitor are part of every Kings System Monitoring run.
name: Kings System Monitoring

on:
  workflow_dispatch:

  push:
    paths:
      - 'system-monitoring.js'
      - 'system-alerts.js'
      - 'system-monitor-discord.js'
      - 'api-resilience.js'
      - 'kings-branding.js'
      - 'branding-self-test.js'
      - 'data-integrity.js'
      - 'system-hardening.js'
      - 'security-audit.js'
      - 'discord-permission-audit.js'
      - 'scripts/git-safe-push.sh'
      - '.github/workflows/system-monitoring.yml'

  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: kings-system-monitoring
  cancel-in-progress: true

jobs:
  system-monitoring:
    name: Monitor Kings Systems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'system-monitoring'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify Technical Health Engines
        run: |
          for file in system-monitoring.js system-alerts.js system-monitor-discord.js api-resilience.js kings-branding.js branding-self-test.js data-integrity.js system-hardening.js security-audit.js discord-permission-audit.js; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing."
              exit 1
            fi
            node --check "$file"
          done

          node branding-self-test.js

          if [ ! -f scripts/git-safe-push.sh ]; then
            echo "ERROR: scripts/git-safe-push.sh is missing."
            exit 1
          fi

          echo "Kings Monitoring, API Resilience, message-only Branding, Data Integrity, Final Hardening, Repository Security Audit, Discord Permission Audit, Live Monitor, System Alerts, and Safe Push are present and syntactically valid."

      - name: Run Kings System Monitoring
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node system-monitoring.js

          # Staff Management is intentionally event-driven: its summary file only changes
          # when Staff data changes. Workflow freshness is therefore the correct heartbeat.
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/system-health.json';
          const health = JSON.parse(fs.readFileSync(file, 'utf8'));
          const staffWorkflow = Array.isArray(health.workflows)
            ? health.workflows.find((item) => item.file === 'staff-management.yml')
            : null;

          if (staffWorkflow?.ok) {
            const staleId = 'stale-data:data/staff-management-summary.json';
            health.issues = (health.issues || []).filter((item) => item.id !== staleId);

            const freshness = health.data?.freshness;
            if (Array.isArray(freshness)) {
              const staffData = freshness.find((item) => item.file === 'data/staff-management-summary.json');
              if (staffData) {
                staffData.ok = true;
                staffData.freshnessBasis = 'staff-management-workflow';
              }
              health.summary.freshDataHealthy = freshness.filter((item) => item.ok).length;
            }

            const critical = health.issues.filter((item) => item.severity === 'critical').length;
            const warnings = health.issues.filter((item) => item.severity === 'warning').length;
            health.summary.criticalIssues = critical;
            health.summary.warnings = warnings;
            health.status = critical ? 'UNHEALTHY' : warnings ? 'DEGRADED' : 'HEALTHY';
            health.healthy = health.status === 'HEALTHY';
            fs.writeFileSync(file, JSON.stringify(health, null, 2) + '\n');
            console.log('Staff Management freshness normalized to workflow heartbeat.');
          }
          NODE

          node data-integrity.js
          node system-hardening.js
          node security-audit.js

          STATUS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.status || 'UNKNOWN'))")
          CRITICAL=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.criticalIssues || 0))")
          WARNINGS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.warnings || 0))")
          INTEGRITY=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.deepIntegrityHealthy || 0) + '/' + String(h.summary?.deepIntegrityChecks || 0))")
          HARDENING=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.hardeningHealthy || 0) + '/' + String(h.summary?.hardeningChecks || 0))")
          SECURITY=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.securityHealthy || 0) + '/' + String(h.summary?.securityChecks || 0))")
          API_HEALTH=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.apiServicesHealthy || 0) + '/' + String(h.summary?.apiServicesChecked || 0) + ' healthy; ' + String(h.summary?.apiServicesDegraded || 0) + ' degraded; ' + String(h.summary?.apiServicesDown || 0) + ' down')")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          echo "Kings System Health before Discord permission audit: $STATUS"
          echo "Critical Issues: $CRITICAL"
          echo "Warnings: $WARNINGS"
          echo "API Resilience: $API_HEALTH"
          echo "Deep Integrity: $INTEGRITY"
          echo "Final Hardening: $HARDENING"
          echo "Repository Security: $SECURITY"

      - name: Audit Kings Systems Discord Permissions
        id: discord_permissions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: |
          node discord-permission-audit.js

          STATUS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.status || 'UNKNOWN'))")
          CRITICAL=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.criticalIssues || 0))")
          WARNINGS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.warnings || 0))")
          PERMISSIONS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.discordPermissionHealthy || 0) + '/' + String(h.summary?.discordPermissionChecks || 0))")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          echo "Kings Final System Health: $STATUS"
          echo "Critical Issues: $CRITICAL"
          echo "Warnings: $WARNINGS"
          echo "Discord Permission Audit: $PERMISSIONS"

      - name: Update Kings Systems Live Monitor
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          SYSTEM_MONITOR_CHANNEL_NAME: 'system-monitor'
        run: node system-monitor-discord.js

      - name: Process Kings System Alerts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          SYSTEM_ALERTS_CHANNEL_NAME: 'system-alerts'
        run: node system-alerts.js

      - name: Save Monitoring State
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/system-alerts-state.json data/api-health)" ]; then
            echo "No Monitoring state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/system-alerts-state.json data/api-health

          if git diff --cached --quiet; then
            echo "No Monitoring state changes staged."
            exit 0
          fi

          git commit -m "Update Kings monitoring state"
          bash scripts/git-safe-push.sh main

      - name: Preserve unhealthy health report
        if: steps.discord_permissions.outputs.status != 'HEALTHY'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-system-health-${{ github.run_number }}
          path: |
            data/system-health.json
            data/data-integrity.json
            data/system-hardening.json
            data/security-audit.json
            data/discord-permission-audit.json
            data/api-health
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      - name: Monitoring Safety Summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Safety" >> "$GITHUB_STEP_SUMMARY"
          echo "Kings System Monitoring, API Resilience, Data Integrity, Final Hardening, Repository Security Audit, Discord Permission Audit, Live Monitor, and System Alerts are technical-only." >> "$GITHUB_STEP_SUMMARY"
          echo "They never change Discord roles, permissions, members, Staff/Driver/HR status, bans, kicks, timeouts, promotions, demotions, or personnel decisions." >> "$GITHUB_STEP_SUMMARY"

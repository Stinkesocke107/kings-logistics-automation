name: Kings System Monitoring

on:
  workflow_dispatch:

  push:
    paths:
      - 'system-monitoring.js'
      - 'system-alerts.js'
      - 'data-integrity.js'
      - '.github/workflows/system-monitoring.yml'

  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: kings-system-monitoring
  cancel-in-progress: true

jobs:
  system-monitoring:
    name: Monitor Kings Systems
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Technical Health Engines
        run: |
          for file in system-alerts.js data-integrity.js; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing."
              exit 1
            fi
          done

          node --check system-monitoring.js
          node --check data-integrity.js
          node --check system-alerts.js
          echo "Kings Monitoring, Data Integrity, and System Alerts engines present and syntactically valid."

      - name: Run Kings System Monitoring
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node system-monitoring.js
          node data-integrity.js

          STATUS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.status || 'UNKNOWN'))")
          CRITICAL=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.criticalIssues || 0))")
          WARNINGS=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.warnings || 0))")
          INTEGRITY=$(node -e "const h=require('./data/system-health.json'); process.stdout.write(String(h.summary?.deepIntegrityHealthy || 0) + '/' + String(h.summary?.deepIntegrityChecks || 0))")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          echo "Kings System Health: $STATUS"
          echo "Critical Issues: $CRITICAL"
          echo "Warnings: $WARNINGS"
          echo "Deep Integrity: $INTEGRITY"

      - name: Process Kings System Alerts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          SYSTEM_ALERTS_CHANNEL_NAME: 'system-alerts'
        run: node system-alerts.js

      - name: Save System Alert State
        run: |
          if git diff --quiet -- data/system-alerts-state.json && [ -z "$(git status --porcelain data/system-alerts-state.json)" ]; then
            echo "No System Alert state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/system-alerts-state.json
          git commit -m "Update Kings System Alert state"
          git pull --rebase origin main
          git push origin main

      - name: Preserve unhealthy health report
        if: steps.health.outputs.status != 'HEALTHY'
        uses: actions/upload-artifact@v4
        with:
          name: kings-system-health-${{ github.run_number }}
          path: |
            data/system-health.json
            data/data-integrity.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Monitoring Safety Summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Safety" >> "$GITHUB_STEP_SUMMARY"
          echo "Kings System Monitoring, Data Integrity, and System Alerts are technical-only." >> "$GITHUB_STEP_SUMMARY"
          echo "They never change Discord roles, permissions, members, Staff/Driver/HR status, bans, kicks, promotions, demotions, or personnel decisions." >> "$GITHUB_STEP_SUMMARY"

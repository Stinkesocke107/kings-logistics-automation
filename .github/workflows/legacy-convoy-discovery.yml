name: Kings Legacy Convoy Discovery

on:
  push:
    branches: [main]
    paths:
      - 'legacy-convoy-discovery.js'
      - '.github/workflows/legacy-convoy-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Discover legacy convoy sources
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node legacy-convoy-discovery.js

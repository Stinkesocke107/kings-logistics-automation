name: Kings Monthly Report Verification

on:
  workflow_dispatch:
    inputs:
      verify_month:
        description: 'Read-only: current readiness or previous completed UTC month'
        type: choice
        required: true
        default: current
        options:
          - current
          - previous
  schedule:
    - cron: "0 11 1 * *"
  push:
    branches:
      - main
    paths:
      - 'monthly-report-v2.js'
      - 'monthly-report-verifier.js'
      - 'monthly-recurring-proof.js'
      - 'statistics-source-provenance.js'
      - 'production-proof-collector.js'
      - '.github/workflows/monthly-report.yml'
      - '.github/workflows/monthly-report-verification.yml'

permissions:
  contents: write

concurrency:
  group: kings-monthly-report-verification
  cancel-in-progress: false

jobs:
  verify-monthly-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Verify Monthly Report Scripts
        run: |
          node --check monthly-report-v2.js
          node --check monthly-report-verifier.js
          node --check monthly-recurring-proof.js
          node --check production-proof-collector.js

      - name: Verify Monthly Report Readiness / Publication
        env:
          MONTHLY_REPORT_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_REPORT_DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_MONTHLY_VERIFICATION_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_month == 'previous' && 'previous' || 'current' }}
        run: node monthly-report-verifier.js

      - name: Capture durable September 2026 Monthly live proof
        run: node production-proof-collector.js monthly

      - name: Capture recurring verified Monthly live proof (read-only sources)
        run: node production-proof-collector.js monthly-recurring

      - name: Persist only accepted Monthly evidence (never overwrite old month)
        shell: bash
        run: |
          set -euo pipefail
          files=()
          if [ -e data/monthly-live-proof.json ]; then files+=(data/monthly-live-proof.json); fi
          if [ -d data/monthly-live-proofs ]; then files+=(data/monthly-live-proofs); fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No accepted Monthly proof to persist.'
            exit 0
          fi
          git config user.name 'Kings Logistics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record verified Kings Monthly production evidence'
          bash scripts/git-safe-push.sh main

      - name: Upload Monthly Verification Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-monthly-report-verification-${{ github.run_number }}
          path: |
            output/monthly-report-verification.json
            output/production-proof-monthly.json
            output/production-proof-monthly-recurring.json
            data/monthly-live-proof.json
            data/monthly-live-proofs/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verification Safety Summary
        if: always()
        run: |
          echo '## Kings Monthly Report Verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Discord writes: **none**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Durable proof writes: **historic September proof plus month-specific accepted records only**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manual previous-month proof: **read-only, exact one Discord post + state ID + full UTC coverage required**' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/production-proof-monthly.json ]; then
            node -e "const r=require('./output/production-proof-monthly.json'); console.log('- September live proof: **'+r.status+'**')" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/production-proof-monthly-recurring.json ]; then
            node -e "const r=require('./output/production-proof-monthly-recurring.json'); console.log('- Closed-month recurring proof: **'+r.status+'**')" >> "$GITHUB_STEP_SUMMARY"
          fi

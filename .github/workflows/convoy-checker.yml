name: Kings Convoy Checker
# Core Event health excludes transient Driver reminder delivery failures.
run-name: Kings Convoy Checker (${{ github.event_name == 'workflow_dispatch' && inputs.capacity_action != 'off' && inputs.capacity_action || (github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'live' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[convoy-live]') && 'live' || 'dry-run'))) }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual convoy run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      capacity_action:
        description: "GitHub-only Capacity (off, preview, preflight, source-preflight, bootstrap, sync)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - preview
          - preflight
          - source-preflight
          - bootstrap
          - sync

  push:
    branches: [main]
    paths:
      - 'convoy-*.js'
      - 'event-leadership-overview.js'
      - 'kings-convoy-announcements.js'
      - 'convoy-e2e-dry-run.js'
      - 'api-resilience.js'
      - '.github/workflows/convoy-checker.yml'

  schedule:
    # Every 15 minutes. GitHub-hosted scheduled runs can start late;
    # alerting monitors real execution rather than assuming punctual delivery.
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: kings-convoy-checker
  cancel-in-progress: false

jobs:
  check-convoys:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'convoy-system'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Determine convoy run mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CAPACITY_ACTION: ${{ inputs.capacity_action }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A manually selected Event Capacity action is a dedicated
          # capacity-only invocation. It must never execute Convoy stages,
          # even if mode=live was selected by the dispatcher.
          CAPACITY_ONLY="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [[ "$CAPACITY_ACTION" =~ ^(preview|preflight|source-preflight|bootstrap|sync)$ ]]; then
            CAPACITY_ONLY="true"
            DRY_RUN="true"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="false"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_MODE" = "live" ]; then
            DRY_RUN="false"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$PUSH_MESSAGE" == *"[convoy-live]"* ]]; then
            DRY_RUN="false"
          else
            DRY_RUN="true"
          fi

          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "capacity_only=$CAPACITY_ONLY" >> "$GITHUB_OUTPUT"
          echo "Convoy dry-run mode: $DRY_RUN"
          echo "Manual capacity-only mode: $CAPACITY_ONLY"

      - name: Verify convoy safety engines
        if: steps.mode.outputs.capacity_only != 'true'
        run: |
          node --check convoy-checker.js
          node --check convoy-finalize.js
          node --check convoy-driver-reminders.js
          node --check convoy-overview-discord.js
          node --check event-leadership-overview.js
          node --check kings-convoy-announcements.js
          node --check convoy-e2e-dry-run.js
          node --check convoy-archived-reminder-policy.js
          node --check convoy-imminent-readiness.js

      - name: Run convoy checker
        if: steps.mode.outputs.capacity_only != 'true'
        id: convoy_stage_0
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          # The first stage only reads/parses Discord. The finalizer writes one
          # authoritative status after TruckersMP data has been loaded.
          DISCORD_WRITE_MODE: 'false'
        run: node convoy-checker.js

      - name: Auto-fill convoy data from TruckersMP Event ID
        id: convoy_stage_1
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_VTC_NAME: 'Kings Logistics'
        run: node convoy-truckersmp-sync.js

      - name: Finalize TruckersMP data and Kings overrides
        id: convoy_stage_2
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-finalize.js

      - name: Audit imminent approved convoy reminder eligibility (read-only, no messages)
        id: convoy_reminder_readiness
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        run: |
          node --test tests/convoy-imminent-readiness.test.cjs
          node convoy-imminent-readiness.js

      - name: Send one-time convoy notifications
        id: convoy_stage_3
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-notifications.js

      - name: Handle post-convoy follow-up
        id: convoy_stage_4
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-reminders.js

      - name: Check internal Convoy Driver reminders
        if: steps.mode.outputs.capacity_only != 'true'
        id: convoy_stage_5
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Private legacy slot/thread evidence is decrypted only inside this authorized reminder job.
          LEGACY_PRIVATE_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_REMINDER_CHANNEL_NAME: 'convoy-reminders'
          DISCORD_DRIVER_ROLE_ID: '1476774746480709675'
          CONVOY_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node convoy-driver-reminders.js

      - name: Check Kings-only convoy announcements
        if: steps.mode.outputs.capacity_only != 'true'
        id: convoy_stage_6
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_KINGS_CONVOY_SOURCE_FORUM_ID: '1506133821693755502'
          DISCORD_KINGS_CONVOY_ANNOUNCEMENT_CHANNEL_ID: '1351613882791366838'
          DISCORD_KINGS_CONVOY_INTERNAL_CHANNEL_ID: '1550997669596631200'
          DISCORD_DRIVER_ROLE_ID: '1476774746480709675'
          CONVOY_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [ "$CONVOY_DRY_RUN" = "true" ]; then
            node convoy-e2e-dry-run.js kings-convoy-announcements.js
          else
            node kings-convoy-announcements.js
          fi

      - name: Archive finished convoy threads
        id: convoy_stage_7
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          CONVOY_ARCHIVE_DELAY_HOURS: '72'
        run: node convoy-archive.js

      - name: Verify convoy completeness
        if: steps.mode.outputs.capacity_only != 'true'
        id: convoy_completeness
        continue-on-error: true
        run: node convoy-completeness.js

      - name: Persist healthy convoy count baseline
        if: (steps.mode.outputs.dry_run != 'true' && steps.convoy_completeness.outcome == 'success') && steps.mode.outputs.capacity_only != 'true'
        run: |
          if [ -n "$(git status --porcelain -- data/convoy-completeness-state.json)" ]; then
            git config user.name "Kings Logistics Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/convoy-completeness-state.json
            git commit -m "Record healthy Convoy Center snapshot"
            if ! bash scripts/git-safe-push.sh main; then
              # This is only a healthy-snapshot telemetry baseline. A concurrent
              # run may have recorded a newer baseline; never let its rebase
              # conflict block subsequent convoy notifications or statistics.
              echo "::warning::Concurrent convoy completeness baseline update. Using the newer repository snapshot."
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main >/dev/null 2>&1 || true
              git reset --hard origin/main >/dev/null 2>&1 || true
            fi
          fi

      - name: Generate convoy overview statistics
        if: steps.mode.outputs.capacity_only != 'true'
        id: convoy_stage_8
        continue-on-error: true
        env:
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-overview.js

      - name: Notify Event Leadership about new planning conflicts
        id: convoy_planning_alerts
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node convoy-planning-alerts.js

      - name: Persist sent planning alert keys
        id: convoy_planning_state
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/convoy-planning-alert-state.json)" ]; then
            echo "No new convoy planning warnings."
          else
            git config user.name "Kings Logistics Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/convoy-planning-alert-state.json
            git commit -m "Persist dispatched Convoy planning alerts"
            if ! bash scripts/git-safe-push.sh main; then
              echo "::error::Convoy alert state could not be persisted. Discord history provides short-term recovery only."
              exit 1
            fi
          fi

      - name: Sync convoy overview to Discord
        id: convoy_stage_9
        continue-on-error: true
        if: (steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_OVERVIEW_CHANNEL_ID: '1550619865805754378'
        run: node convoy-overview-discord.js

      # Manual source-preflight verifies the real scheduled Convoy ZIP
      # privately using GitHub Actions read-only API requests. No Discord.
      # Event Capacity uses this already scheduled GitHub-hosted runner:
      # no second workflow, no VPS, and no live Discord Gateway.
      # Default OFF; manual preview is read-only even without credentials.
      - name: Kings Event Capacity (GitHub-only opt-in)
        id: event_capacity_github_only
        continue-on-error: true
        if: >-
          (github.event_name == 'schedule' && vars.KINGS_EVENT_CAPACITY_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' &&
            (inputs.capacity_action == 'preview' ||
              inputs.capacity_action == 'preflight' ||
              inputs.capacity_action == 'source-preflight' ||
              (vars.KINGS_EVENT_CAPACITY_ENABLED == 'true' &&
                (inputs.capacity_action == 'bootstrap' || inputs.capacity_action == 'sync'))))
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Do not inject the real Discord secret into preview/source-only
          # runs. The other modes still use the existing protected bot secret.
          DISCORD_BOT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && (inputs.capacity_action == 'preview' || inputs.capacity_action == 'source-preflight') && 'READ_ONLY_NO_DISCORD_TOKEN' || secrets.DISCORD_BOT_TOKEN }}
          KINGS_EVENT_CAPACITY_ENABLED: ${{ vars.KINGS_EVENT_CAPACITY_ENABLED }}
          KINGS_EVENT_CAPACITY_COMMANDS_ENABLED: ${{ vars.KINGS_EVENT_CAPACITY_COMMANDS_ENABLED }}
          KINGS_EVENT_CAPACITY_EVIDENCE_ENABLED: ${{ vars.KINGS_EVENT_CAPACITY_EVIDENCE_ENABLED }}
          KINGS_EVENT_CAPACITY_MODE: ${{ github.event_name == 'schedule' && 'sync' || inputs.capacity_action }}
          CONVOY_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          KINGS_EVENT_CAPACITY_GUILD_ID: '1114967437788577792'
          KINGS_EVENT_CAPACITY_CHANNEL_ID: ${{ vars.KINGS_EVENT_CAPACITY_CHANNEL_ID }}
          KINGS_EVENT_CAPACITY_MESSAGE_ID: ${{ vars.KINGS_EVENT_CAPACITY_MESSAGE_ID }}
          KINGS_EVENT_COORDINATION_ROLE_ID: ${{ vars.KINGS_EVENT_COORDINATION_ROLE_ID }}
          KINGS_EVENT_LEADERSHIP_ROLE_ID: ${{ vars.KINGS_EVENT_LEADERSHIP_ROLE_ID }}
          KINGS_EVENT_CEO_ROLE_ID: ${{ vars.KINGS_EVENT_CEO_ROLE_ID }}
        run: |
          node --check event-capacity-github-only.js
          node --check event-capacity-private-channel-preflight.js
          node --check event-capacity-source-preflight.js
          node --check event-capacity-github-staff-commands.js
          node --check event-capacity-github-decision-evidence.js
          node --check scripts/event-capacity-github-actions.js
          node --test tests/event-capacity-github-only.test.cjs tests/event-capacity-private-channel-preflight.test.cjs tests/event-capacity-source-preflight.test.cjs tests/event-capacity-github-actions-runner.test.cjs tests/event-capacity-github-staff-commands.test.cjs tests/event-capacity-github-decision-evidence.test.cjs
          node scripts/event-capacity-github-actions.js

      - name: Note optional Event Capacity errors without masking Convoy health
        if: steps.event_capacity_github_only.outcome == 'failure'
        run: echo "::warning::Optional GitHub-only Event Capacity run failed; do not treat availability as verified."

      - name: Require GitHub Event Calendar source readiness when requested
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_action == 'source-preflight'
        env:
          SOURCE_PREFLIGHT_OUTCOME: ${{ steps.event_capacity_github_only.outcome }}
        run: |
          if [ "$SOURCE_PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::error::Scheduled Convoy ZIP to Calendar preflight did not pass. No Discord or Event writes were attempted."
            exit 1
          fi

      - name: Require private Event Capacity preflight readiness when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_action == 'preflight'
        env:
          PREFLIGHT_OUTCOME: ${{ steps.event_capacity_github_only.outcome }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::error::Private Event Capacity configuration check did not pass; no Discord writes were attempted."
            exit 1
          fi

      - name: Require manually requested Event Capacity publication outcome
        if: github.event_name == 'workflow_dispatch' && (inputs.capacity_action == 'bootstrap' || inputs.capacity_action == 'sync' || inputs.capacity_action == 'preview')
        env:
          CAPACITY_OUTCOME: ${{ steps.event_capacity_github_only.outcome }}
        run: |
          if [ "$CAPACITY_OUTCOME" != "success" ]; then
            echo "::error::Requested Event Capacity action failed. No Convoy stages were run in this capacity-only invocation."
            exit 1
          fi

      - name: Event Capacity capacity-only summary
        if: steps.mode.outputs.capacity_only == 'true'
        run: |
          echo "Manual Event Capacity-only invocation completed; no Convoy operational stages were run."
          echo "This does not certify free Event slots or historical source completeness."

      - name: Dry-run safety summary
        if: (steps.mode.outputs.dry_run == 'true') && steps.mode.outputs.capacity_only != 'true'
        run: |
          echo "Convoy read-only preflight completed; skipped stages are NOT E2E verified."
          echo "Convoy checker writes were disabled."
          echo "Driver reminders were validated without posting."
          echo "Public 2h announcement writes were blocked at the fetch layer."
          echo "Other mutating convoy steps were skipped."

      - name: Upload convoy reports
        if: (always()) && steps.mode.outputs.capacity_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-convoy-reports
          path: |
            output/convoy-check-results.json
            output/convoy-overview.json
            output/convoy-planning-limits.json
            output/convoy-completeness.json
            output/convoy-overview.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Save API Health State
        if: ${{ always() && steps.mode.outputs.dry_run != 'true' && steps.mode.outputs.capacity_only != 'true' }}
        run: |
          if [ ! -d data/api-health ] || [ -z "$(git status --porcelain -- data/api-health)" ]; then
            echo "No API health state changes to save."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/api-health
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings API health state"

          # API-health is telemetry. If another Kings workflow has already written
          # a newer state for the same service, never turn an otherwise healthy
          # convoy execution red just because the telemetry commit conflicts.
          if ! bash scripts/git-safe-push.sh main; then
            echo "::warning::API health telemetry changed concurrently. Keeping the newer remote state and treating this persistence conflict as non-fatal."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            exit 0
          fi

      # Core convoy operations remain health-critical. Driver reminder delivery is
      # auxiliary and retries on the next run, so a transient Discord rate limit
      # must not mark the entire Convoy / Event System as failed.
      - name: Require successful convoy planning notification and persistence
        if: (always() && steps.mode.outputs.dry_run != 'true') && steps.mode.outputs.capacity_only != 'true'
        env:
          ALERT_OUTCOME: ${{ steps.convoy_planning_alerts.outcome }}
          STATE_OUTCOME: ${{ steps.convoy_planning_state.outcome }}
        run: |
          if [ "$ALERT_OUTCOME" != "success" ] || [ "$STATE_OUTCOME" != "success" ]; then
            echo "::error::Convoy planning alerts or durable state persistence failed."
            exit 1
          fi

      - name: Require convoy completeness
        if: (always()) && steps.mode.outputs.capacity_only != 'true'
        env:
          COMPLETENESS_OUTCOME: ${{ steps.convoy_completeness.outcome }}
        run: |
          if [ "$COMPLETENESS_OUTCOME" != "success" ]; then
            echo "::error::Convoy completeness check did not pass."
            exit 1
          fi

      - name: Require successful convoy stages
        if: (always()) && steps.mode.outputs.capacity_only != 'true'
        env:
          CORE_OUTCOMES: ${{ join(fromJSON(format('["{0}","{1}","{2}","{3}","{4}","{5}","{6}","{7}","{8}"]', steps.convoy_stage_0.outcome, steps.convoy_stage_1.outcome, steps.convoy_stage_2.outcome, steps.convoy_stage_3.outcome, steps.convoy_stage_4.outcome, steps.convoy_stage_6.outcome, steps.convoy_stage_7.outcome, steps.convoy_stage_8.outcome, steps.convoy_stage_9.outcome)), ',') }}
          DRIVER_REMINDER_OUTCOME: ${{ steps.convoy_stage_5.outcome }}
        run: |
          if [ "$DRIVER_REMINDER_OUTCOME" = "failure" ]; then
            echo "::warning::Convoy Driver reminders hit a transient delivery failure. Core Convoy/Event health remains valid and reminders will retry on the next run."
          fi
          node -e "if ((process.env.CORE_OUTCOMES || '').split(',').includes('failure')) { console.error('One or more core convoy stages failed; inspect the reports and logs.'); process.exit(1); }"

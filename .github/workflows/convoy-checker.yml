name: Kings Convoy Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  check-convoys:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run convoy checker and sync Discord status + forum tag
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'true'
        run: node convoy-checker.js

      - name: Convert convoy event times to Discord timestamps
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-time-display.js

      - name: Send one-time convoy notifications
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-notifications.js

      - name: Send scheduled convoy reminders
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          CONVOY_REMINDER_TEST_MODE: 'true'
        run: node convoy-reminders.js

      - name: Generate convoy overview statistics
        env:
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-overview.js

      - name: Sync convoy overview to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_OVERVIEW_CHANNEL_ID: '1550619865805754378'
        run: node convoy-overview-discord.js

      - name: Upload convoy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-convoy-reports
          path: |
            output/convoy-check-results.json
            output/convoy-overview.json
            output/convoy-overview.md
          if-no-files-found: ignore
          retention-days: 14

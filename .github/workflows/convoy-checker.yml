name: Kings Convoy Checker
# Core Event health excludes transient Driver reminder delivery failures.
run-name: Kings Convoy Checker (${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'live' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[convoy-live]') && 'live' || 'dry-run')) }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual convoy run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

  push:
    branches: [main]
    paths:
      - 'convoy-*.js'
      - 'event-leadership-overview.js'
      - 'kings-convoy-announcements.js'
      - 'convoy-e2e-dry-run.js'
      - 'api-resilience.js'
      - '.github/workflows/convoy-checker.yml'

  schedule:
    # Shifted by one minute to force GitHub to register a genuinely new schedule trigger.
    - cron: '6-59/15 * * * *'

permissions:
  contents: write

concurrency:
  group: kings-convoy-checker
  cancel-in-progress: false

jobs:
  check-convoys:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGS_API_HEALTH_NAMESPACE: 'convoy-system'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Determine convoy run mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="false"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_MODE" = "live" ]; then
            DRY_RUN="false"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$PUSH_MESSAGE" == *"[convoy-live]"* ]]; then
            DRY_RUN="false"
          else
            DRY_RUN="true"
          fi

          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Convoy dry-run mode: $DRY_RUN"

      - name: Verify convoy safety engines
        run: |
          node --check convoy-checker.js
          node --check convoy-finalize.js
          node --check convoy-driver-reminders.js
          node --check convoy-overview-discord.js
          node --check event-leadership-overview.js
          node --check kings-convoy-announcements.js
          node --check convoy-e2e-dry-run.js

      - name: Run convoy checker
        id: convoy_stage_0
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          # The first stage only reads/parses Discord. The finalizer writes one
          # authoritative status after TruckersMP data has been loaded.
          DISCORD_WRITE_MODE: 'false'
        run: node convoy-checker.js

      - name: Auto-fill convoy data from TruckersMP Event ID
        id: convoy_stage_1
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KINGS_VTC_NAME: 'Kings Logistics'
        run: node convoy-truckersmp-sync.js

      - name: Finalize TruckersMP data and Kings overrides
        id: convoy_stage_2
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-finalize.js

      - name: Send one-time convoy notifications
        id: convoy_stage_3
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-notifications.js

      - name: Handle post-convoy follow-up
        id: convoy_stage_4
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-reminders.js

      - name: Check internal Convoy Driver reminders
        id: convoy_stage_5
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_REMINDER_CHANNEL_NAME: 'convoy-reminders'
          DISCORD_DRIVER_ROLE_ID: '1476774746480709675'
          CONVOY_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node convoy-driver-reminders.js

      - name: Check Kings-only convoy announcements
        id: convoy_stage_6
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_KINGS_CONVOY_SOURCE_FORUM_ID: '1506133821693755502'
          DISCORD_KINGS_CONVOY_ANNOUNCEMENT_CHANNEL_ID: '1351613882791366838'
          DISCORD_KINGS_CONVOY_INTERNAL_CHANNEL_ID: '1550997669596631200'
          DISCORD_DRIVER_ROLE_ID: '1476774746480709675'
          CONVOY_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [ "$CONVOY_DRY_RUN" = "true" ]; then
            node convoy-e2e-dry-run.js kings-convoy-announcements.js
          else
            node kings-convoy-announcements.js
          fi

      - name: Archive finished convoy threads
        id: convoy_stage_7
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          CONVOY_ARCHIVE_DELAY_HOURS: '72'
        run: node convoy-archive.js

      - name: Verify convoy completeness
        id: convoy_completeness
        continue-on-error: true
        run: node convoy-completeness.js

      - name: Persist healthy convoy count baseline
        if: steps.mode.outputs.dry_run != 'true' && steps.convoy_completeness.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain -- data/convoy-completeness-state.json)" ]; then
            git config user.name "Kings Logistics Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/convoy-completeness-state.json
            git commit -m "Record healthy Convoy Center snapshot"
            if ! bash scripts/git-safe-push.sh main; then
              # This is only a healthy-snapshot telemetry baseline. A concurrent
              # run may have recorded a newer baseline; never let its rebase
              # conflict block subsequent convoy notifications or statistics.
              echo "::warning::Concurrent convoy completeness baseline update. Using the newer repository snapshot."
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main >/dev/null 2>&1 || true
              git reset --hard origin/main >/dev/null 2>&1 || true
            fi
          fi

      - name: Generate convoy overview statistics
        id: convoy_stage_8
        continue-on-error: true
        env:
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
        run: node convoy-overview.js

      - name: Notify Event Leadership about new planning conflicts
        id: convoy_planning_alerts
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node convoy-planning-alerts.js

      - name: Persist sent planning alert keys
        id: convoy_planning_state
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/convoy-planning-alert-state.json)" ]; then
            echo "No new convoy planning warnings."
          else
            git config user.name "Kings Logistics Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/convoy-planning-alert-state.json
            git commit -m "Persist dispatched Convoy planning alerts"
            if ! bash scripts/git-safe-push.sh main; then
              echo "::error::Convoy alert state could not be persisted. Discord history provides short-term recovery only."
              exit 1
            fi
          fi

      - name: Sync convoy overview to Discord
        id: convoy_stage_9
        continue-on-error: true
        if: steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_OVERVIEW_CHANNEL_ID: '1550619865805754378'
        run: node convoy-overview-discord.js

      - name: Dry-run safety summary
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          echo "Convoy read-only preflight completed; skipped stages are NOT E2E verified."
          echo "Convoy checker writes were disabled."
          echo "Driver reminders were validated without posting."
          echo "Public 2h announcement writes were blocked at the fetch layer."
          echo "Other mutating convoy steps were skipped."

      - name: Upload convoy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kings-convoy-reports
          path: |
            output/convoy-check-results.json
            output/convoy-overview.json
            output/convoy-planning-limits.json
            output/convoy-completeness.json
            output/convoy-overview.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Save API Health State
        if: ${{ always() && steps.mode.outputs.dry_run != 'true' }}
        run: |
          if [ ! -d data/api-health ] || [ -z "$(git status --porcelain -- data/api-health)" ]; then
            echo "No API health state changes to save."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/api-health
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kings API health state"

          # API-health is telemetry. If another Kings workflow has already written
          # a newer state for the same service, never turn an otherwise healthy
          # convoy execution red just because the telemetry commit conflicts.
          if ! bash scripts/git-safe-push.sh main; then
            echo "::warning::API health telemetry changed concurrently. Keeping the newer remote state and treating this persistence conflict as non-fatal."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            exit 0
          fi

      # Core convoy operations remain health-critical. Driver reminder delivery is
      # auxiliary and retries on the next run, so a transient Discord rate limit
      # must not mark the entire Convoy / Event System as failed.
      - name: Require successful convoy planning notification and persistence
        if: always() && steps.mode.outputs.dry_run != 'true'
        env:
          ALERT_OUTCOME: ${{ steps.convoy_planning_alerts.outcome }}
          STATE_OUTCOME: ${{ steps.convoy_planning_state.outcome }}
        run: |
          if [ "$ALERT_OUTCOME" != "success" ] || [ "$STATE_OUTCOME" != "success" ]; then
            echo "::error::Convoy planning alerts or durable state persistence failed."
            exit 1
          fi

      - name: Require convoy completeness
        if: always()
        env:
          COMPLETENESS_OUTCOME: ${{ steps.convoy_completeness.outcome }}
        run: |
          if [ "$COMPLETENESS_OUTCOME" != "success" ]; then
            echo "::error::Convoy completeness check did not pass."
            exit 1
          fi

      - name: Require successful convoy stages
        if: always()
        env:
          CORE_OUTCOMES: ${{ join(fromJSON(format('["{0}","{1}","{2}","{3}","{4}","{5}","{6}","{7}","{8}"]', steps.convoy_stage_0.outcome, steps.convoy_stage_1.outcome, steps.convoy_stage_2.outcome, steps.convoy_stage_3.outcome, steps.convoy_stage_4.outcome, steps.convoy_stage_6.outcome, steps.convoy_stage_7.outcome, steps.convoy_stage_8.outcome, steps.convoy_stage_9.outcome)), ',') }}
          DRIVER_REMINDER_OUTCOME: ${{ steps.convoy_stage_5.outcome }}
        run: |
          if [ "$DRIVER_REMINDER_OUTCOME" = "failure" ]; then
            echo "::warning::Convoy Driver reminders hit a transient delivery failure. Core Convoy/Event health remains valid and reminders will retry on the next run."
          fi
          node -e "if ((process.env.CORE_OUTCOMES || '').split(',').includes('failure')) { console.error('One or more core convoy stages failed; inspect the reports and logs.'); process.exit(1); }"

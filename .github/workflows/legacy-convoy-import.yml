name: Kings Legacy Convoy Import

on:
  # Import remains manual; push only migrates the old public data to protected storage.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy-convoy-privacy.js'
      - 'scripts/migrate-legacy-convoy-private.js'
      - 'data/legacy-convoys.json'
      - '.github/workflows/legacy-convoy-import.yml'

permissions:
  contents: write

concurrency:
  group: kings-legacy-convoy-import
  cancel-in-progress: false

jobs:
  privacy-migration:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Preserve original archive and sanitize public Legacy output
        env:
          LEGACY_PRIVATE_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
        run: |
          node --check scripts/migrate-legacy-convoy-private.js
          node scripts/migrate-legacy-convoy-private.js
          node scripts/verify-legacy-public-privacy.js
      - name: Commit new encrypted archive and redacted public projection together
        run: |
          if [ -z "$(git status --porcelain -- data/legacy-convoys.json data/legacy-convoys-private.json)" ]; then
            echo "Legacy privacy migration already complete."
            exit 0
          fi
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/legacy-convoys.json data/legacy-convoys-private.json
          git commit -m "Protect original Kings Legacy Convoy notes and sanitize public state"
          bash scripts/git-safe-push.sh main

  import-old-calendar:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify importer
        run: node --check legacy-convoy-import.js

      - name: Import old Convoy Calendar
        env:
          LEGACY_PRIVATE_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: |
          node legacy-convoy-import.js
          node scripts/verify-legacy-public-privacy.js

      - name: Save frozen Legacy Convoy migration
        run: |
          if [ -z "$(git status --porcelain -- data/legacy-convoys.json data/legacy-convoys-private.json data/legacy-convoys-import-summary.json)" ]; then
            echo "No Legacy Convoy data changes."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          # Preserve the private encrypted source atomically with public projection.
          # Omitting the private file would make later refreshes silently stale.
          git add data/legacy-convoys.json data/legacy-convoys-private.json data/legacy-convoys-import-summary.json
          git commit -m "Import old Convoy Calendar into frozen Legacy data"
          bash scripts/git-safe-push.sh main

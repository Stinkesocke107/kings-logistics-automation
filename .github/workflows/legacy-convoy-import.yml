name: Kings Legacy Convoy Import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy-convoy-import.js'
      - '.github/workflows/legacy-convoy-import.yml'

permissions:
  contents: write

concurrency:
  group: kings-legacy-convoy-import
  cancel-in-progress: false

jobs:
  import-old-calendar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify importer
        run: node --check legacy-convoy-import.js

      - name: Import old Convoy Calendar
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
        run: node legacy-convoy-import.js

      - name: Save frozen Legacy Convoy migration
        run: |
          if [ -z "$(git status --porcelain -- data/legacy-convoys.json data/legacy-convoys-import-summary.json)" ]; then
            echo "No Legacy Convoy data changes."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/legacy-convoys.json data/legacy-convoys-import-summary.json
          git commit -m "Import old Convoy Calendar into frozen Legacy data"
          bash scripts/git-safe-push.sh main

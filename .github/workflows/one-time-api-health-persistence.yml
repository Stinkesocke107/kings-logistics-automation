name: One-time API Health Persistence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-api-health-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply API health persistence
        run: python3 tools/persist-api-health.py

      - name: Validate workflow YAML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              '.github/workflows/driver-updates.yml',
              '.github/workflows/staff-management.yml',
              '.github/workflows/news.yml',
              '.github/workflows/live-tracker.yml',
              '.github/workflows/convoy-checker.yml',
          ]
          for file in files:
              text = Path(file).read_text(encoding='utf-8')
              if 'Save API Health State' not in text:
                  raise SystemExit(f'Missing API health persistence in {file}')
          if 'data/driver-change-guard.json' not in Path('.github/workflows/driver-updates.yml').read_text(encoding='utf-8'):
              raise SystemExit('Driver change guard is not persisted')
          print('API health persistence checks passed.')
          PY

      - name: Remove temporary migration files
        if: always()
        run: |
          rm -f .github/workflows/one-time-api-health-persistence.yml
          rm -f tools/persist-api-health.py

      - name: Save API health persistence
        if: always()
        run: |
          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist Kings API health across workflows"
          git pull --rebase origin main
          git push origin main

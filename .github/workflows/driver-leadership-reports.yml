name: Kings Driver Leadership Reports

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Driver Leadership report to run"
        required: true
        default: "daily-preview"
        type: choice
        options:
          - daily-preview
          - daily-publish
          - monthly-preview
          - monthly-publish
          - welcome-review-preview
          - welcome-review-publish

  push:
    branches:
      - main
    paths:
      - 'driver-leadership-reports.js'
      - 'driver-welcome-register-review.js'
      - '.github/workflows/driver-leadership-reports.yml'

  schedule:
    # Daily changes: 18:30 UTC. Sends nothing if there were no meaningful changes.
    - cron: "30 18 * * *"
    # Monthly report: first day of each month at 09:30 UTC for the completed month.
    - cron: "30 9 1 * *"

env:
  LEADERSHIP_CONSOLIDATED_ONLY: 'true'

permissions:
  contents: write

concurrency:
  group: kings-driver-leadership-reports
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify Driver Leadership reports
        run: |
          node --check driver-leadership-reports.js
          node --check driver-welcome-register-review.js

      # A real Discord GET-only diagnostic on this workflow's relevant pushes.
      # It must never publish driver IDs/dates or change any Discord messages.
      # An external Discord permission issue is visible as a failed step, but
      # cannot block a syntactically valid code fix from being verified.
      - name: Read-only Welcome Review privacy preflight
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
          DRIVER_WELCOME_REVIEW_MODE: preflight
        run: node driver-welcome-register-review.js


  daily:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '30 18 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.report == 'daily-preview' || inputs.report == 'daily-publish'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Create Driver Daily Changes
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_LEADERSHIP_CHANNEL_NAME: '🚛｜driver-leadership'
          DRIVER_LEADERSHIP_REPORT_MODE: 'daily'
          DRIVER_LEADERSHIP_REPORT_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'daily-preview' }}
        run: node driver-leadership-reports.js

      - name: Save Daily Report State
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report == 'daily-publish') }}
        run: |
          if git diff --quiet -- data/driver-leadership-report-state.json && [ -z "$(git status --porcelain data/driver-leadership-report-state.json)" ]; then
            echo "No Driver Leadership report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/driver-leadership-report-state.json
          git commit -m "Update Driver Leadership daily report state"
          bash scripts/git-safe-push.sh main

  monthly:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '30 9 1 * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.report == 'monthly-preview' || inputs.report == 'monthly-publish'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Create Driver Monthly Report
        env:
          DRIVER_STATE_KEY: ${{ secrets.DRIVER_STATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DRIVER_LEADERSHIP_CHANNEL_NAME: '🚛｜driver-leadership'
          DRIVER_LEADERSHIP_REPORT_MODE: 'monthly'
          DRIVER_LEADERSHIP_REPORT_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'monthly-preview' }}
        run: node driver-leadership-reports.js

      - name: Save Monthly Report State
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report == 'monthly-publish') }}
        run: |
          if git diff --quiet -- data/driver-leadership-report-state.json && [ -z "$(git status --porcelain data/driver-leadership-report-state.json)" ]; then
            echo "No Driver Leadership report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/driver-leadership-report-state.json
          git commit -m "Update Driver Leadership monthly report state"
          bash scripts/git-safe-push.sh main

  welcome-review:
    # Intentional, operator-triggered review only. Never backfill joining dates
    # or send per-member information during schedules or routine code pushes.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.report == 'welcome-review-preview' || inputs.report == 'welcome-review-publish')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Explicit, narrowly scoped manual report exception. The consolidated
      # daily/monthly Leadership report policy remains unchanged.
      LEADERSHIP_CONSOLIDATED_ONLY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify welcome review implementation
        run: node --check driver-welcome-register-review.js

      - name: Review historical Driver Updates welcomes for private Leadership
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRIVER_UPDATES_WEBHOOK_URL: ${{ secrets.DRIVER_UPDATES_WEBHOOK_URL }}
          DRIVER_WELCOME_REVIEW_MODE: ${{ inputs.report == 'welcome-review-publish' && 'publish' || 'preview' }}
        run: node driver-welcome-register-review.js

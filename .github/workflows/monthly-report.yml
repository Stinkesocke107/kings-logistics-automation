name: Kings Monthly Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose how the Kings Monthly Report should run"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - publish

  schedule:
    - cron: "0 10 1 * *"

  # One-time, explicit CEO-approved October report edit; deleted after completion.
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-report.yml'

permissions:
  contents: write

concurrency:
  group: kings-monthly-report
  cancel-in-progress: false

jobs:
  create-monthly-report:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'KINGS_OCTOBER_CONVOY_BACKFILL_2026_11_01'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Verify Monthly Report Script
        run: node --check monthly-report-v2.js

      - name: Build fresh read-only Kings Convoy participation overview
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1114967437788577792'
          DISCORD_CONVOY_FORUM_ID: '1550619824005062697'
          DISCORD_WRITE_MODE: 'false'
          CONVOY_FINALIZE_WRITE_MODE: 'false'
          KINGS_VTC_NAME: 'Kings Logistics'
        run: |
          node convoy-checker.js
          node convoy-truckersmp-sync.js
          node convoy-finalize.js
          node convoy-overview.js

      - name: Create Kings Monthly Report
        env:
          MONTHLY_REPORT_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_REPORT_DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NEWS_NOTIFICATIONS_ROLE_ID: ${{ secrets.NEWS_NOTIFICATIONS_ROLE_ID }}
          MONTHLY_REPORT_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
          MONTHLY_REPORT_CONVOY_BACKFILL: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'KINGS_OCTOBER_CONVOY_BACKFILL_2026_11_01') && '2026-10' || '' }}
        run: node monthly-report-v2.js

      - name: Save Monthly Report Data Safely
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'KINGS_OCTOBER_CONVOY_BACKFILL_2026_11_01')) }}
        run: |
          if git diff --quiet -- data/monthly-report-state.json && [ -z "$(git status --porcelain data/monthly-report-state.json)" ]; then
            echo "No Monthly Report state changes to save."
            exit 0
          fi

          git config user.name "Kings Logistics Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/monthly-report-state.json
          git commit -m "Update Kings Monthly Report state"
          bash scripts/git-safe-push.sh main

      - name: Monthly Report Safety Summary
        if: always()
        run: |
          echo '## Kings Monthly Report' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scheduled publish: **1st day of each month at 10:00 UTC**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Calendar coverage: **every day of the reporting month is required**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Duplicate protection: **Git state + Discord webhook history**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Incomplete Driver History: **clearly omitted, never invented as zero values**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Convoy participation: **confirmed Kings slots (Convoy Center + Legacy, deduplicated)**' >> "$GITHUB_STEP_SUMMARY"
